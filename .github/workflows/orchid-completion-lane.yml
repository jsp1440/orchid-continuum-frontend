name: Orchid Completion Lane

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: string

concurrency:
  group: orchid-completion-lane-${{ github.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      GH_TOKEN: ${{ github.token }}
      INTEGRATION_BRANCH: oc-autonomous-integration
    steps:
      - name: Checkout autonomous integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.INTEGRATION_BRANCH }}
          fetch-depth: 0

      - name: Verify scheduler lease
        id: lease
        shell: bash
        run: |
          set -euo pipefail
          labels=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,labels --jq 'select(.state == "OPEN") | [.labels[].name] | join(" ")' 2>/dev/null || true)
          marker="OC-AUTO-ISSUE: #${ISSUE_NUMBER}"
          durable=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base "$INTEGRATION_BRANCH" --limit 100 --json number,body --jq "[.[] | select(.body != null and (.body | contains(\"${marker}\")))][0].number // empty" 2>/dev/null || true)
          if [[ "$labels" == *oc-running* && -n "$durable" && "$labels" != *oc-repair* ]]; then
            echo "execute=false" >> "$GITHUB_OUTPUT"
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-running --remove-label oc-queued --add-label oc-validating >/dev/null 2>&1 || true
          elif [[ "$labels" == *oc-running* && "$labels" != *oc-runtime-backoff* ]]; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
          else
            echo "execute=false" >> "$GITHUB_OUTPUT"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Stale/duplicate completion dispatch suppressed before provider execution because this issue no longer owns an oc-running lease. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." >/dev/null 2>&1 || true
          fi

      - name: Load issue context
        if: steps.lease.outputs.execute == 'true'
        id: issue
        shell: bash
        run: |
          set -euo pipefail
          title=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq '.title')
          body=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')
          {
            echo 'title<<EOF'
            echo "$title"
            echo EOF
            echo 'body<<EOF'
            echo "$body"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Completion worker started; provider order=Claude→Gemini→OpenAI. Run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." >/dev/null

      - name: Resolve durable PR lineage
        if: steps.lease.outputs.execute == 'true'
        id: lineage
        shell: bash
        run: |
          set -euo pipefail
          marker="OC-AUTO-ISSUE: #${ISSUE_NUMBER}"
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base "$INTEGRATION_BRANCH" --limit 100 --json number,body --jq ".[] | select(.body != null and (.body | contains(\"$marker\"))) | .number" || true)
          pr=${pr%%$'\n'*}
          if [[ -n "$pr" ]]; then
            branch=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefName --jq '.headRefName')
            echo "existing_pr=$pr" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "existing_pr=" >> "$GITHUB_OUTPUT"
            echo "branch=oc-auto-${ISSUE_NUMBER}-fallback-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute issue with Claude Code
        if: steps.lease.outputs.execute == 'true'
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@c81e3bc69d1b18badbb63ba39581218f02421678 # v1.0.201
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            ORCHID CONTINUUM — CONTINUOUS COMPLETION LANE

            Repository: ${{ github.repository }}
            Integration base: oc-autonomous-integration
            Source issue: #${{ inputs.issue_number }} — ${{ steps.issue.outputs.title }}

            Issue requirements:
            ${{ steps.issue.outputs.body }}

            EXECUTE BEFORE EXPLAINING. This is one lane in a continuously refilling multi-lane completion system.

            Rules:
            - Start from the current `oc-autonomous-integration` branch, then inspect current `main` and overlapping PRs before editing; converge rather than duplicate.
            - If an open PR already contains `OC-AUTO-ISSUE: #${{ inputs.issue_number }}`, update that same PR/branch instead of creating another.
            - Implement the largest safe bounded vertical slice that can be completed in this run.
            - Use real Continuum data/contracts; unavailable != absent; do not invent scientific evidence.
            - Run focused tests, broader tests, lint, typecheck/build and browser/preview validation where appropriate; repair failures before delivery.
            - Commit and push durable work. Open/update exactly one draft PR targeting `oc-autonomous-integration` and include these exact machine-readable lines in its body:
              `OC-AUTO-ISSUE: #${{ inputs.issue_number }}`
              `OC-AUTO-REQUEUE: true|false`
              `OC-AUTO-BLOCKED: true|false`
            - If the entire issue cannot fit in one run, deliver a coherent working slice and record explicit remaining acceptance items; never return only an audit or plan.
            - Never merge to `main`, deploy production, mutate production DB/KG/scientific state, activate taxonomy, publish science, create/disclose credentials, spend funds, force-push, or delete branches/repos.
            - Final output: DONE, VALIDATION, PR/HEAD SHA, REMAINING, OWNER GATE if any.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 75
            --allowedTools "Edit,Read,Write,Bash(git diff:*),Bash(git status:*),Bash(git ls-files:*),Bash(git log:*),Bash(git rev-parse:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(git fetch:*),Bash(git merge:*),Bash(npm:*),Bash(npx:*),Bash(test:*),Bash(gh pr:*),Bash(gh issue:*)"
            --append-system-prompt "Read CLAUDE.md and repository instructions before editing. Orchid Continuum Brain and GitHub are authoritative. BLOCKED DOES NOT MEAN STOPPED FOR THE PROGRAM. Deliver durable GitHub work, never runner-local-only claims. Preserve taxonomy, provenance, uncertainty and sensitive-locality rules."

      - name: Diagnose the Claude run
        if: always() && steps.lease.outputs.execute == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/diagnose-claude-run.mjs

      - name: Classify Claude terminal state
        if: always() && steps.lease.outputs.execute == 'true'
        id: claude_provider
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          execution_log="/home/runner/work/_temp/claude-execution-output.json"
          normalized=""
          if [[ -f "$execution_log" ]]; then
            normalized=$(jq -r '[.. | strings] | join(" ")' "$execution_log" 2>/dev/null | tr '[:upper:]' '[:lower:]' || true)
          fi
          kind=healthy
          fallback=false
          if [[ "$CLAUDE_OUTCOME" != "success" ]]; then
            if [[ "$normalized" == *"error_max_turns"* || "$normalized" == *"max_turns"* || "$normalized" == *"max turns"* || "$normalized" == *"maximum turns"* ]]; then
              kind=max_turns
            elif [[ "$normalized" == *"authentication"* || "$normalized" == *"unauthorized"* || "$normalized" == *"forbidden"* || "$normalized" == *"permission"* || "$normalized" == *"invalid api key"* || "$normalized" == *"invalid_api_key"* ]]; then
              kind=security
            elif [[ "$normalized" == *"billing_error"* || "$normalized" == *"credit balance"* || "$normalized" == *"insufficient credit"* || "$normalized" == *"rate_limit"* || "$normalized" == *"rate limit"* || "$normalized" == *"overloaded"* || "$normalized" == *"service unavailable"* || "$normalized" == *"connection_error"* || "$normalized" == *"timeout"* ]]; then
              kind=safe_provider
              fallback=true
            else
              kind=unknown
            fi
          fi
          {
            echo "kind=$kind"
            echo "fallback_allowed=$fallback"
          } >> "$GITHUB_OUTPUT"
          echo "Claude classification: kind=$kind fallback_allowed=$fallback"

      - name: Execute bounded Gemini fallback
        if: steps.claude_provider.outputs.fallback_allowed == 'true'
        id: gemini
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
          WORK_BRANCH: ${{ steps.lineage.outputs.branch }}
          EXISTING_PR: ${{ steps.lineage.outputs.existing_pr }}
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/gemini-stderr.log"
          : > "$RUNNER_TEMP/gemini-result.json"
          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "config_missing" > "$RUNNER_TEMP/gemini-status.txt"
            exit 20
          fi

          if [[ -n "${EXISTING_PR:-}" ]]; then
            git fetch origin "$WORK_BRANCH"
            git checkout -B "$WORK_BRANCH" "origin/$WORK_BRANCH"
          else
            git checkout -B "$WORK_BRANCH" "$INTEGRATION_BRANCH"
          fi
          git config user.name "orchid-continuum-orchestrator[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          prompt=$(cat <<EOF
          ORCHID CONTINUUM — GOVERNED GEMINI FALLBACK

          Claude was safely classified unavailable. Implement the largest safe coherent repository-local slice for issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}.

          ${ISSUE_BODY}

          EDIT FILES ONLY. Do not use shell tools. Do not create commits, branches, pull requests, issues, releases, deployments, credentials, or external publications; the workflow owns packaging. Preserve taxonomy, provenance, uncertainty, sensitive-locality protections, unavailable-vs-zero semantics, scientific review boundaries, tests, security checks, governance, and owner gates. Never invent science. Do not mutate production data, activate taxonomy, publish science, spend funds, or perform destructive operations.
          EOF
          )

          gemini_home="$RUNNER_TEMP/gemini-home"
          mkdir -p "$gemini_home/.gemini"
          cat > "$gemini_home/.gemini/settings.json" <<'JSON'
          {
            "tools": {
              "exclude": ["run_shell_command"]
            }
          }
          JSON

          set +e
          HOME="$gemini_home" env -u GH_TOKEN GEMINI_API_KEY="$GEMINI_API_KEY" GEMINI_CLI_TRUST_WORKSPACE=true \
            timeout 35m npx -y @google/gemini-cli@latest \
            --approval-mode auto_edit --output-format json -p "$prompt" \
            > "$RUNNER_TEMP/gemini-result.json" 2> "$RUNNER_TEMP/gemini-stderr.log"
          status=$?
          set -e
          echo "$status" > "$RUNNER_TEMP/gemini-exit.txt"

          if ! git diff --quiet || [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
            git diff --check
            git add -A
            git commit -m "feat(auto): Gemini fallback slice for #${ISSUE_NUMBER}"
            git push origin "HEAD:$WORK_BRANCH"
            if [[ -z "${EXISTING_PR:-}" ]]; then
              body=$(cat <<EOF
          Governed Gemini fallback slice after Claude safe-provider failure.

          Provider: Gemini fallback
          Claude classification: ${{ steps.claude_provider.outputs.kind }}
          Gemini exit status: ${status}

          Independent exact-head validation remains mandatory. No production mutation, taxonomy activation, scientific publication, sensitive-locality relaxation, credential change, spending action, or destructive operation was authorized.

          OC-AUTO-ISSUE: #${ISSUE_NUMBER}
          OC-AUTO-REQUEUE: true
          OC-AUTO-BLOCKED: false
          EOF
              )
              gh pr create --repo "$GITHUB_REPOSITORY" --base "$INTEGRATION_BRANCH" --head "$WORK_BRANCH" --draft --title "Gemini fallback: #${ISSUE_NUMBER} ${ISSUE_TITLE}" --body "$body" >/dev/null
            fi
            exit 0
          fi
          exit "$status"

      - name: Classify Gemini terminal state
        if: always() && steps.claude_provider.outputs.fallback_allowed == 'true'
        id: gemini_provider
        env:
          GEMINI_OUTCOME: ${{ steps.gemini.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          kind=healthy
          fallback=false
          if [[ "$GEMINI_OUTCOME" != "success" ]]; then
            if [[ -f "$RUNNER_TEMP/gemini-status.txt" ]] && grep -q 'config_missing' "$RUNNER_TEMP/gemini-status.txt"; then
              kind=config
            elif grep -Eqi '401|403|unauthor|forbidden|invalid.?api.?key|authentication|permission' "$RUNNER_TEMP/gemini-stderr.log" "$RUNNER_TEMP/gemini-result.json" 2>/dev/null; then
              kind=security
            elif grep -Eqi '429|quota|rate.?limit|billing|credit|overloaded|service unavailable|temporarily unavailable|timeout|timed out|connection' "$RUNNER_TEMP/gemini-stderr.log" "$RUNNER_TEMP/gemini-result.json" 2>/dev/null || [[ "$(cat "$RUNNER_TEMP/gemini-exit.txt" 2>/dev/null || true)" == "124" ]]; then
              kind=safe_provider
              fallback=true
            else
              kind=unknown
            fi
          fi
          {
            echo "kind=$kind"
            echo "fallback_allowed=$fallback"
          } >> "$GITHUB_OUTPUT"
          echo "Gemini classification: kind=$kind fallback_allowed=$fallback"

      - name: Execute bounded OpenAI fallback
        if: steps.gemini_provider.outputs.fallback_allowed == 'true'
        id: openai
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
          WORK_BRANCH: ${{ steps.lineage.outputs.branch }}
          EXISTING_PR: ${{ steps.lineage.outputs.existing_pr }}
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/openai-stdout.log"
          : > "$RUNNER_TEMP/openai-stderr.log"
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "config_missing" > "$RUNNER_TEMP/openai-status.txt"
            exit 20
          fi

          if [[ -n "${EXISTING_PR:-}" ]]; then
            git fetch origin "$WORK_BRANCH"
            git checkout -B "$WORK_BRANCH" "origin/$WORK_BRANCH"
          else
            git checkout -B "$WORK_BRANCH" "$INTEGRATION_BRANCH"
          fi
          git config user.name "orchid-continuum-orchestrator[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          prompt=$(cat <<EOF
          ORCHID CONTINUUM — GOVERNED OPENAI SECOND FALLBACK

          Claude and Gemini were both safely classified unavailable for provider-capacity reasons. Implement the largest safe coherent repository-local slice for issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}.

          ${ISSUE_BODY}

          Work only inside the checked-out repository. Do not use git or gh and do not access network resources from model-generated commands. Do not create commits, branches, pull requests, issues, releases, deployments, credentials, or external publications; the workflow owns packaging. Preserve taxonomy, provenance, uncertainty, sensitive-locality protections, unavailable-vs-zero semantics, scientific review boundaries, tests, security checks, governance, and owner gates. Never invent science. Do not mutate production data, activate taxonomy, publish science, spend funds, or perform destructive operations. You may inspect/edit repository files and run local tests within the workspace sandbox.
          EOF
          )

          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          set +e
          env -u GH_TOKEN OPENAI_API_KEY="$OPENAI_API_KEY" timeout 35m \
            npx -y @openai/codex@latest --ask-for-approval never exec \
            --sandbox workspace-write --skip-git-repo-check --ephemeral -C "$GITHUB_WORKSPACE" "$prompt" \
            > "$RUNNER_TEMP/openai-stdout.log" 2> "$RUNNER_TEMP/openai-stderr.log"
          status=$?
          set -e
          echo "$status" > "$RUNNER_TEMP/openai-exit.txt"
          gh auth setup-git >/dev/null

          if ! git diff --quiet || [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
            git diff --check
            git add -A
            git commit -m "feat(auto): OpenAI fallback slice for #${ISSUE_NUMBER}"
            git push origin "HEAD:$WORK_BRANCH"
            if [[ -z "${EXISTING_PR:-}" ]]; then
              body=$(cat <<EOF
          Governed OpenAI second-fallback slice after safe Claude and Gemini provider failures.

          Provider: OpenAI fallback
          Claude classification: ${{ steps.claude_provider.outputs.kind }}
          Gemini classification: ${{ steps.gemini_provider.outputs.kind }}
          OpenAI exit status: ${status}

          Independent exact-head validation remains mandatory. No production mutation, taxonomy activation, scientific publication, sensitive-locality relaxation, credential change, spending action, or destructive operation was authorized.

          OC-AUTO-ISSUE: #${ISSUE_NUMBER}
          OC-AUTO-REQUEUE: true
          OC-AUTO-BLOCKED: false
          EOF
              )
              gh pr create --repo "$GITHUB_REPOSITORY" --base "$INTEGRATION_BRANCH" --head "$WORK_BRANCH" --draft --title "OpenAI fallback: #${ISSUE_NUMBER} ${ISSUE_TITLE}" --body "$body" >/dev/null
            fi
            exit 0
          fi
          exit "$status"

      - name: Classify OpenAI terminal state
        if: always() && steps.gemini_provider.outputs.fallback_allowed == 'true'
        id: openai_provider
        env:
          OPENAI_OUTCOME: ${{ steps.openai.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          kind=healthy
          if [[ "$OPENAI_OUTCOME" != "success" ]]; then
            if [[ -f "$RUNNER_TEMP/openai-status.txt" ]] && grep -q 'config_missing' "$RUNNER_TEMP/openai-status.txt"; then
              kind=config
            elif grep -Eqi '401|403|unauthor|forbidden|invalid.?api.?key|authentication|permission' "$RUNNER_TEMP/openai-stderr.log" "$RUNNER_TEMP/openai-stdout.log" 2>/dev/null; then
              kind=security
            elif grep -Eqi '429|quota|rate.?limit|billing|credit|overloaded|service unavailable|temporarily unavailable|timeout|timed out|connection' "$RUNNER_TEMP/openai-stderr.log" "$RUNNER_TEMP/openai-stdout.log" 2>/dev/null || [[ "$(cat "$RUNNER_TEMP/openai-exit.txt" 2>/dev/null || true)" == "124" ]]; then
              kind=safe_provider
            else
              kind=unknown
            fi
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "OpenAI classification: kind=$kind"

      - name: Classify lane result and release slot
        if: always() && steps.lease.outputs.execute == 'true'
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          CLAUDE_KIND: ${{ steps.claude_provider.outputs.kind }}
          CLAUDE_FALLBACK: ${{ steps.claude_provider.outputs.fallback_allowed }}
          GEMINI_OUTCOME: ${{ steps.gemini.outcome }}
          GEMINI_KIND: ${{ steps.gemini_provider.outputs.kind }}
          GEMINI_FALLBACK: ${{ steps.gemini_provider.outputs.fallback_allowed }}
          OPENAI_OUTCOME: ${{ steps.openai.outcome }}
          OPENAI_KIND: ${{ steps.openai_provider.outputs.kind }}
        shell: bash
        run: |
          set -euo pipefail
          marker="OC-AUTO-ISSUE: #${ISSUE_NUMBER}"
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base "$INTEGRATION_BRANCH" --limit 100 --json number,body --jq ".[] | select(.body != null and (.body | contains(\"$marker\"))) | .number" || true)
          pr=${pr%%$'\n'*}

          gh label create oc-runtime-backoff --repo "$GITHUB_REPOSITORY" --color 6e7781 --description "Worker parked after provider-chain failure; retry only after recovery evidence" 2>/dev/null || true
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-running >/dev/null 2>&1 || true

          if [[ -n "$pr" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-queued --remove-label oc-blocked --remove-label oc-runtime-backoff --remove-label oc-repair --add-label oc-validating >/dev/null 2>&1 || true
            head=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefName --jq '.headRefName')
            gh workflow run frontend-ci.yml --repo "$GITHUB_REPOSITORY" --ref "$head" >/dev/null
            gh workflow run calyx-matrix-005-validation.yml --repo "$GITHUB_REPOSITORY" --ref "$head" >/dev/null
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Lane delivered/updated integration PR #$pr and dispatched independent frontend validation. Provider state: Claude=${CLAUDE_KIND:-unknown}, Gemini=${GEMINI_KIND:-not-run}, OpenAI=${OPENAI_KIND:-not-run}." >/dev/null
          elif [[ "$CLAUDE_KIND" == "max_turns" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-runtime-backoff --remove-label oc-validating --add-label oc-repair >/dev/null 2>&1 || true
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Claude reached the bounded turn ceiling; provider runtime remains healthy. Issue moved to oc-repair for a narrower continuation." >/dev/null
          elif [[ "$CLAUDE_FALLBACK" == "true" && "$GEMINI_OUTCOME" == "success" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-runtime-backoff --remove-label oc-validating --add-label oc-queued --add-label oc-repair >/dev/null 2>&1 || true
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Claude was safely unavailable; Gemini completed without durable changes. Returned to bounded repair without waiting for Claude recovery." >/dev/null
          elif [[ "$GEMINI_FALLBACK" == "true" && "$OPENAI_OUTCOME" == "success" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-runtime-backoff --remove-label oc-validating --add-label oc-queued --add-label oc-repair >/dev/null 2>&1 || true
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Claude and Gemini were safely unavailable; OpenAI completed without durable changes. Returned to bounded repair." >/dev/null
          elif [[ "$CLAUDE_FALLBACK" == "true" && "$GEMINI_FALLBACK" != "true" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-queued --remove-label oc-validating --remove-label oc-repair --add-label oc-runtime-backoff >/dev/null 2>&1 || true
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Claude was safely unavailable, but Gemini failed with non-substitutable classification=${GEMINI_KIND:-unknown}. Failed closed; OpenAI was not attempted." >/dev/null
          elif [[ "$GEMINI_FALLBACK" == "true" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-queued --remove-label oc-validating --remove-label oc-repair --add-label oc-runtime-backoff >/dev/null 2>&1 || true
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] All eligible providers were exhausted without durable work. Parked in oc-runtime-backoff without provider thrashing. OpenAI classification=${OPENAI_KIND:-unknown}." >/dev/null
          elif [[ "$CLAUDE_OUTCOME" != "success" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-queued --remove-label oc-validating --remove-label oc-repair --add-label oc-runtime-backoff >/dev/null 2>&1 || true
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Claude failed with non-fallback classification=${CLAUDE_KIND:-unknown}. Failed closed; no provider bypass attempted." >/dev/null
          else
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-validating --remove-label oc-runtime-backoff --add-label oc-queued >/dev/null 2>&1 || true
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Preferred provider completed without a durable integration PR. Returned to the queue for a bounded retry." >/dev/null
          fi
