name: Orchid Completion Lane

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load issue context
        id: issue
        shell: bash
        run: |
          set -euo pipefail
          title=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq '.title')
          body=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')
          {
            echo 'title<<EOF'
            echo "$title"
            echo EOF
            echo 'body<<EOF'
            echo "$body"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Execute issue with Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            ORCHID CONTINUUM — CONTINUOUS COMPLETION LANE

            Repository: ${{ github.repository }}
            Source issue: #${{ inputs.issue_number }} — ${{ steps.issue.outputs.title }}

            Issue requirements:
            ${{ steps.issue.outputs.body }}

            EXECUTE BEFORE EXPLAINING. This is one lane in a continuously refilling multi-lane completion system.

            Rules:
            - Inspect current main and overlapping PRs before editing; converge rather than duplicate.
            - Implement the largest safe bounded vertical slice that can be completed in this run.
            - Use real Continuum data/contracts; unavailable != absent; do not invent scientific evidence.
            - Run focused tests, broader tests, lint, typecheck/build and browser/preview validation where appropriate; repair failures before delivery.
            - Commit and push durable work. Open/update exactly one draft PR to main and include the exact marker `OC-AUTO-ISSUE: #${{ inputs.issue_number }}` in the PR body.
            - If the entire issue cannot fit in one run, deliver a coherent working slice and record explicit remaining acceptance items; never return only an audit or plan.
            - If owner-gated or externally blocked, document the exact blocker and release the lane; other modules must continue.
            - Never merge, deploy production, mutate production DB/KG/scientific state, activate taxonomy, publish science, create/disclose credentials, spend funds, force-push, or delete branches/repos.
            - Final output: DONE, VALIDATION, PR/HEAD SHA, REMAINING, OWNER GATE if any.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 75
            --allowedTools "Edit,Read,Write,Bash(git diff:*),Bash(git status:*),Bash(git ls-files:*),Bash(git log:*),Bash(git rev-parse:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(git fetch:*),Bash(npm:*),Bash(npx:*),Bash(test:*),Bash(gh pr:*),Bash(gh issue:*)"
            --append-system-prompt "Read CLAUDE.md and repository instructions before editing. Orchid Continuum Brain and GitHub are authoritative. BLOCKED DOES NOT MEAN STOPPED FOR THE PROGRAM. Deliver durable GitHub work, never runner-local-only claims. Preserve taxonomy, provenance, uncertainty and sensitive-locality rules."

      - name: Classify lane result and release slot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          marker="OC-AUTO-ISSUE: #${ISSUE_NUMBER}"
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,body --jq ".[] | select(.body != null and (.body | contains(\"$marker\"))) | .number" | head -1)

          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-running >/dev/null 2>&1 || true

          if [[ -n "$pr" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label oc-owner-gate >/dev/null
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Lane delivered PR #$pr and released its execution slot. The queue continues with the next eligible module; this issue is now owner/CI-gated." >/dev/null
          else
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label oc-queued >/dev/null
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Lane ended without a durable PR. Returned to the queue for retry while other modules continue." >/dev/null
          fi
