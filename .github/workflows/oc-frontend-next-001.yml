name: OC-FRONTEND-NEXT-001 Validation

on:
  pull_request:
    paths:
      - "src/lib/parallelPlatform*"
      - "src/data/parallelPlatformFixtures.ts"
      - "src/pages/ContinuumNext.tsx"
      - "src/pages/RelationshipMatrixNext.tsx"
      - "src/pages/OrchidIdentificationNext.tsx"
      - "src/App.tsx"
      - ".github/workflows/oc-frontend-next-001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typed-experience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test -- --run src/lib/parallelPlatform.test.ts
      - run: npm run lint
      - run: npm run build
