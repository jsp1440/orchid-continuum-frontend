name: Frontend OpenAI Lane Repair

on:
  pull_request:
    branches: [oc-autonomous-integration]
    paths:
      - '.github/workflows/frontend-openai-lane-repair.yml'
      - '.github/workflows/orchid-completion-lane.yml'
      - 'src/openaiFallbackWorkflow.test.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'repair/frontend-openai-runtime-diagnostics'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: repair/frontend-openai-runtime-diagnostics
          fetch-depth: 0

      - name: Apply bounded lane repair
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/orchid-completion-lane.yml')
          text = path.read_text()

          old_exec = '''          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          set +e
          env -u GH_TOKEN OPENAI_API_KEY="$OPENAI_API_KEY" timeout 35m \\
            npx -y @openai/codex@latest --ask-for-approval never exec \\
            --sandbox workspace-write --skip-git-repo-check --ephemeral -C "$GITHUB_WORKSPACE" "$prompt" \\
            > "$RUNNER_TEMP/openai-stdout.log" 2> "$RUNNER_TEMP/openai-stderr.log"
          status=$?
'''
          new_exec = '''          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$CODEX_HOME"
          set +e
          printf '%s\\n' "$OPENAI_API_KEY" | npx -y @openai/codex@0.151.0 login --with-api-key \\
            > "$RUNNER_TEMP/openai-login.log" 2>> "$RUNNER_TEMP/openai-stderr.log"
          login_status=$?
          if [[ "$login_status" -eq 0 ]]; then
            env -u GH_TOKEN OPENAI_API_KEY="$OPENAI_API_KEY" CODEX_HOME="$CODEX_HOME" timeout 35m \\
              npx -y @openai/codex@0.151.0 --ask-for-approval never exec \\
              --sandbox workspace-write --skip-git-repo-check --ephemeral -C "$GITHUB_WORKSPACE" "$prompt" \\
              > "$RUNNER_TEMP/openai-stdout.log" 2>> "$RUNNER_TEMP/openai-stderr.log"
            status=$?
          else
            status=$login_status
          fi
'''

          old_security = '''            elif grep -Eqi '401|403|unauthor|forbidden|invalid.?api.?key|authentication|permission' "$RUNNER_TEMP/openai-stderr.log" "$RUNNER_TEMP/openai-stdout.log" 2>/dev/null; then
              kind=security
            elif grep -Eqi '429|quota|rate.?limit|billing|credit|overloaded|service unavailable|temporarily unavailable|timeout|timed out|connection' "$RUNNER_TEMP/openai-stderr.log" "$RUNNER_TEMP/openai-stdout.log" 2>/dev/null || [[ "$(cat "$RUNNER_TEMP/openai-exit.txt" 2>/dev/null || true)" == "124" ]]; then
'''
          new_security = '''            elif grep -Eqi '(^|[^0-9])(401|403)([^0-9]|$)|unauthori[sz]ed|invalid[_ .-]?api[_ .-]?key|authentication (failed|required)|missing scopes?:|insufficient permissions?.*(api|operation)|api\\.responses\\.write' "$RUNNER_TEMP/openai-stderr.log" 2>/dev/null; then
              kind=security
            elif grep -Eqi '429|quota|rate.?limit|billing|credit|overloaded|service unavailable|temporarily unavailable|timeout|timed out|connection|websocket.*(reset|closed|failed)' "$RUNNER_TEMP/openai-stderr.log" 2>/dev/null || [[ "$(cat "$RUNNER_TEMP/openai-exit.txt" 2>/dev/null || true)" == "124" ]]; then
'''

          if old_exec not in text:
              if '@openai/codex@0.151.0 login --with-api-key' in text:
                  print('Execution repair already applied')
              else:
                  raise SystemExit('Expected OpenAI execution block not found; fail closed')
          else:
              text = text.replace(old_exec, new_exec, 1)

          if old_security not in text:
              if 'api\\.responses\\.write' in text and 'openai-stderr.log" "$RUNNER_TEMP/openai-stdout.log' not in text:
                  print('Classifier repair already applied')
              else:
                  raise SystemExit('Expected OpenAI classifier block not found; fail closed')
          else:
              text = text.replace(old_security, new_security, 1)

          path.write_text(text)

      - name: Verify repair contract
        run: |
          set -euo pipefail
          grep -F 'export CODEX_HOME="$RUNNER_TEMP/codex-home"' .github/workflows/orchid-completion-lane.yml
          grep -F '@openai/codex@0.151.0 login --with-api-key' .github/workflows/orchid-completion-lane.yml
          grep -F 'CODEX_HOME="$CODEX_HOME" timeout 35m' .github/workflows/orchid-completion-lane.yml
          ! grep -F '@openai/codex@latest --ask-for-approval never exec' .github/workflows/orchid-completion-lane.yml
          git diff --check

      - name: Commit repair to the PR head
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No lane repair commit required.'
            exit 0
          fi
          git config user.name 'orchid-continuum-orchestrator[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/orchid-completion-lane.yml
          git commit -m 'fix(autonomy): authenticate Codex fallback before execution'
          git push origin HEAD:repair/frontend-openai-runtime-diagnostics
