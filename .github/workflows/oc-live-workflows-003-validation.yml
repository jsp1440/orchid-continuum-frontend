name: OC-LIVE-WORKFLOWS-003 Validation

on:
  pull_request:
    paths:
      - 'src/pages/RelationshipMatrixNext.tsx'
      - 'src/pages/OrchidIdentificationNext.tsx'
      - '.github/workflows/oc-live-workflows-003-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src/pages/RelationshipMatrixNext.tsx src/pages/OrchidIdentificationNext.tsx --max-warnings=0
      - run: npm run build
