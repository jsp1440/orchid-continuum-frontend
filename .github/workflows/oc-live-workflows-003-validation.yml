name: OC-LIVE-WORKFLOWS-003 Validation

on:
  pull_request:
    paths:
      - 'src/pages/RelationshipMatrixNext.tsx'
      - 'src/pages/OrchidIdentificationNext.tsx'
      - '.github/workflows/oc-live-workflows-003-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src/pages/RelationshipMatrixNext.tsx src/pages/OrchidIdentificationNext.tsx --max-warnings=0
      - run: npm run build
