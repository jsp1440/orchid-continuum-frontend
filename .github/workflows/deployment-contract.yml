name: Deployment Contract

on:
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'public/_redirects'
      - 'vercel.json'
      - 'scripts/verify-deployment-contract.mjs'
      - 'package.json'
      - '.github/workflows/deployment-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'public/_redirects'
      - 'vercel.json'
      - 'scripts/verify-deployment-contract.mjs'
      - 'package.json'
      - '.github/workflows/deployment-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run validate:deployment
      - run: npm run build
