name: Deployment Contract

on:
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'public/_redirects'
      - 'render.yaml'
      - 'scripts/verify-deployment-contract.mjs'
      - 'package.json'
      - '.github/workflows/deployment-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'public/_redirects'
      - 'render.yaml'
      - 'scripts/verify-deployment-contract.mjs'
      - 'package.json'
      - '.github/workflows/deployment-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Same pins and Node major as frontend-ci.yml, so the two gates cannot
      # drift apart on runtime.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:deployment
      - run: npm run build
