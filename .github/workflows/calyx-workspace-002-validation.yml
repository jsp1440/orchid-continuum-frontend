name: CALYX-WORKSPACE-002 Validation

on:
  pull_request:
    paths:
      - 'src/lib/calyxWorkspace.ts'
      - 'src/lib/calyxVerification.ts'
      - 'src/lib/calyxVerification.test.ts'
      - 'src/components/calyx/ScientificSynthesis.tsx'
      - 'src/components/calyx/ScientificSynthesis.test.tsx'
      - 'src/components/calyx/CalyxVerificationWorkbench.tsx'
      - 'src/pages/CalyxWorkspace.tsx'
      - 'src/App.tsx'
      - '.github/workflows/calyx-workspace-002-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src/lib/calyxWorkspace.ts src/lib/calyxVerification.ts src/lib/calyxVerification.test.ts src/components/calyx/ScientificSynthesis.tsx src/components/calyx/ScientificSynthesis.test.tsx src/components/calyx/CalyxVerificationWorkbench.tsx src/pages/CalyxWorkspace.tsx src/App.tsx --max-warnings=0
      - run: npx vitest run src/lib/calyxVerification.test.ts src/components/calyx/ScientificSynthesis.test.tsx
      - run: npm run build
