name: Temporary HomeAtlas visibility repair

on:
  push:
    branches:
      - fix/home-atlas-default-all-points

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-atlas-default-all-points
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply bounded Atlas visibility patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/orchid/HomeAtlas.tsx')
          text = path.read_text()
          old = """  // Filters — the map auto-filters to the synchronized \"Genus of the Day\" on\n  // load. Seeded from context so it always matches the other homepage sections.\n  // The user can deselect the chip or hit Reset to see everything.\n  const [selectedGenera, setSelectedGenera] = useState<Set<string>>(\n    () => new Set([dailyGenus]),\n  );\n\n  // Keep the genus filter seed in sync if the 12-hour window rotates while\n  // the page is open (or if the context resolves from the Supabase snapshot\n  // after mount).\n  useEffect(() => {\n    setSelectedGenera(new Set([dailyGenus]));\n  }, [dailyGenus]);\n"""
          new = """  // Filters start unscoped so a featured genus absent from the loaded occurrence\n  // sample cannot make a healthy Atlas appear empty. The shared daily genus remains\n  // visible and explicitly selectable in the filter UI.\n  const [selectedGenera, setSelectedGenera] = useState<Set<string>>(new Set());\n"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one HomeAtlas filter seed block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - run: npm ci
      - name: Focused Atlas regression
        run: npx vitest run src/components/orchid/HomeAtlas.initialVisibility.test.ts
      - name: HomeAtlas lint
        run: npx eslint src/components/orchid/HomeAtlas.tsx src/components/orchid/HomeAtlas.initialVisibility.test.ts
      - name: Production build
        run: npm run build
      - name: Commit validated repair and remove temporary workflow
        run: |
          rm .github/workflows/temp-home-atlas-default-all-points.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/orchid/HomeAtlas.tsx .github/workflows/temp-home-atlas-default-all-points.yml
          git commit -m "fix(atlas): show all occurrence points by default"
          git push origin HEAD:fix/home-atlas-default-all-points
