name: Orchid Budgeted Completion Lane

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: string
      wave_hash:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      provider_authorized:
        required: false
        type: boolean
        default: false
      requested_usd:
        required: false
        type: number
        default: 0.50

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

concurrency:
  group: orchid-governed-issue-${{ github.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  # Routing decides before the provider preflight runs, so only the lane that
  # did not execute can ever write a `provider_not_authorized` receipt.
  classify:
    runs-on: ubuntu-latest
    outputs:
      provider_free: ${{ steps.route.outputs.provider_free }}
      commands: ${{ steps.route.outputs.commands }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Route this issue by declared capability
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: node scripts/oc-provider-free-route.mjs

  budget-preflight:
    needs: classify
    if: needs.classify.outputs.provider_free != 'true'
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.budget.outputs.allowed }}
      lease_id: ${{ steps.budget.outputs.lease_id }}
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      PROVIDER_AUTHORIZED: ${{ inputs.provider_authorized }}
      REQUESTED_USD: ${{ inputs.requested_usd }}
      OC_WAVE_HASH: ${{ inputs.wave_hash }}
      OC_PROVIDER_NO_API_MODE: 'true'
      OC_PROVIDER_DISABLED: 'anthropic,gemini,openai'
      OC_PROVIDER_DAILY_MAX_CALLS: '0'
      OC_PROVIDER_WAVE_MAX_CALLS: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact_name }}
          path: .oc-wave
      - name: Preserve existing provider policy, throttles and fingerprints
        id: policy
        run: npx --no-install tsx scripts/provider-governor-workflow-gate.ts
      - name: Fail-closed budget and exclusive durable reservation
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          OC_PROVIDER_POLICY_ALLOWED: ${{ steps.policy.outputs.allow_paid_execution }}
        run: npx --no-install tsx scripts/oc-dispatch-runtime.ts admit
      - name: Preserve denied-lane receipt
        if: steps.budget.outputs.allowed == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oc-lane-${{ github.run_attempt }}-${{ inputs.issue_number }}
          path: .oc-receipts/*.json
          include-hidden-files: true
          if-no-files-found: error

  # Deterministic work does not need, and must not wait for, provider
  # authorization. It still takes a lease, so unchanged work is not run again on
  # the next pulse: the fingerprint check lives behind the provider gate in
  # `claimLease`, which is why #171 executed three times in four minutes.
  deterministic-preflight:
    needs: classify
    if: needs.classify.outputs.provider_free == 'true'
    runs-on: ubuntu-latest
    # Declared, not inherited. Without this the job picks up the workflow-level
    # `actions: write` and `id-token: write` it has no use for. It reads the plan
    # and writes the ledger branch and a refusal label, and nothing else.
    permissions:
      contents: write
      issues: write
    outputs:
      allowed: ${{ steps.lease.outputs.allowed }}
      lease_id: ${{ steps.lease.outputs.lease_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact_name }}
          path: .oc-wave
      - name: Reserve a zero-cost lane and refuse unchanged work
        id: lease
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          OC_WAVE_HASH: ${{ inputs.wave_hash }}
        run: npx --no-install tsx scripts/oc-dispatch-runtime.ts admit-deterministic
      - name: Preserve the not-executed receipt
        if: steps.lease.outputs.allowed == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oc-lane-${{ github.run_attempt }}-${{ inputs.issue_number }}
          path: .oc-receipts/*.json
          include-hidden-files: true
          if-no-files-found: error

  provider-free-worker:
    needs: [classify, deterministic-preflight]
    if: needs.deterministic-preflight.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      REPO: ${{ github.repository }}
      WAVE_HASH: ${{ inputs.wave_hash }}
      COMMANDS: ${{ needs.classify.outputs.commands }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: npm ci --ignore-scripts
      # The browser route sentinel is a deterministic capability, but the
      # Playwright package does not download Chromium during npm ci. Install
      # only the browser that this declared command needs; no provider or
      # external model is involved.
      - name: Install Chromium for browser route verification
        if: contains(needs.classify.outputs.commands, 'npm run verify:routes')
        run: npx --no-install playwright install --with-deps chromium
      - name: Build and start preview for browser route verification
        if: contains(needs.classify.outputs.commands, 'npm run verify:routes')
        run: |
          npm run build
          nohup npx --no-install vite preview --host 127.0.0.1 --port 4173 >/tmp/oc-vite-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/oc-vite-preview.log
          exit 1
      # No provider secret is present in this job, and none is forwarded to it.
      # The commands are chosen from a fixed registry, never from issue text.
      - name: Execute declared deterministic capabilities
        run: node scripts/oc-provider-free-execute.mjs
      - name: Preserve execution evidence for settlement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oc-evidence-${{ github.run_attempt }}-${{ inputs.issue_number }}
          path: .oc-evidence/*.json
          include-hidden-files: true
          if-no-files-found: ignore

  # The one authoritative receipt for a deterministic lane, written by the job
  # that can tell whether execution actually happened.
  settle-deterministic:
    needs: [deterministic-preflight, provider-free-worker]
    if: always() && needs.deterministic-preflight.outputs.lease_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact_name }}
          path: .oc-wave
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: oc-evidence-${{ github.run_attempt }}-${{ inputs.issue_number }}
          path: .oc-evidence
      - name: Settle the deterministic lane against its evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          OC_LEASE_ID: ${{ needs.deterministic-preflight.outputs.lease_id }}
          OC_WAVE_HASH: ${{ inputs.wave_hash }}
        run: npx --no-install tsx scripts/oc-dispatch-runtime.ts settle-deterministic
      # `always()`, so a settlement that throws still leaves the audit a receipt
      # rather than an unexplained gap and a lane held until the lease expires.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oc-lane-${{ github.run_attempt }}-${{ inputs.issue_number }}
          path: .oc-receipts/*.json
          include-hidden-files: true
          if-no-files-found: ignore

  provider-worker:
    needs: budget-preflight
    if: inputs.provider_authorized && needs.budget-preflight.outputs.allowed == 'true' && needs.budget-preflight.outputs.lease_id != ''
    uses: ./.github/workflows/orchid-completion-lane.yml
    with:
      issue_number: ${{ inputs.issue_number }}
      provider_authorized: ${{ inputs.provider_authorized }}
      lease_id: ${{ needs.budget-preflight.outputs.lease_id }}
      wave_hash: ${{ inputs.wave_hash }}
      artifact_name: ${{ inputs.artifact_name }}
    # No provider secrets are forwarded while the owner has prohibited paid execution.

  settle:
    needs: [budget-preflight, provider-worker]
    if: always() && needs.budget-preflight.outputs.lease_id != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact_name }}
