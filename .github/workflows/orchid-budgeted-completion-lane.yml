name: Orchid Budgeted Completion Lane

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: string
      wave_hash:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      provider_authorized:
        required: false
        type: boolean
        default: false
      requested_usd:
        required: false
        type: number
        default: 0.50

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

concurrency:
  group: orchid-governed-issue-${{ github.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  budget-preflight:
    runs-on: ubuntu-latest
    # Admits or refuses one issue against the budget: reads a wave artifact and
    # writes a receipt. It mints no OIDC token and dispatches no workflow, so it
    # does not get `id-token: write` or `actions: write` — the same latent
    # privilege the classify narrowing removed, on a job that also takes
    # attacker-controlled issue text as input.
    permissions:
      contents: read
      issues: write
    outputs:
      allowed: ${{ steps.budget.outputs.allowed }}
      lease_id: ${{ steps.budget.outputs.lease_id }}
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      PROVIDER_AUTHORIZED: ${{ inputs.provider_authorized }}
      REQUESTED_USD: ${{ inputs.requested_usd }}
      OC_WAVE_HASH: ${{ inputs.wave_hash }}
      OC_PROVIDER_NO_API_MODE: 'true'
      OC_PROVIDER_DISABLED: 'anthropic,gemini,openai'
      OC_PROVIDER_DAILY_MAX_CALLS: '0'
      OC_PROVIDER_WAVE_MAX_CALLS: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact_name }}
          path: .oc-wave
      - name: Preserve existing provider policy, throttles and fingerprints
        id: policy
        run: npx --no-install tsx scripts/provider-governor-workflow-gate.ts
      - name: Fail-closed budget and exclusive durable reservation
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          OC_PROVIDER_POLICY_ALLOWED: ${{ steps.policy.outputs.allow_paid_execution }}
        run: npx --no-install tsx scripts/oc-dispatch-runtime.ts admit
      - name: Preserve denied-lane receipt
        if: steps.budget.outputs.allowed == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oc-lane-${{ github.run_attempt }}-${{ inputs.issue_number }}
          path: .oc-receipts/*.json
          include-hidden-files: true
          if-no-files-found: error

  # Deterministic work does not need, and must not wait for, provider
  # authorization. Before this job existed the lane had only a provider worker,
  # so an issue needing nothing but `npm run test` was refused with the same
  # `provider_not_authorized` receipt as one needing a model, and dropped — every
  # five minutes, for 24 queued issues, while the run reported success.
  classify:
    runs-on: ubuntu-latest
    # This job's entire input is issue text and labels, which anyone who can open
    # an issue controls. It reads one issue and writes one local file, so it gets
    # exactly that: without this block it inherits the workflow-level grant, which
    # includes `actions: write` and `id-token: write`.
    permissions:
      contents: read
      issues: read
    outputs:
      provider_free: ${{ steps.route.outputs.provider_free }}
      commands: ${{ steps.route.outputs.commands }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Route this issue by declared capability
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: node scripts/oc-provider-free-route.mjs
      # Without this the routing record dies with the runner, and a refusal that
      # explains itself only in a job log is not durable. `provider-free-worker`
      # had the same gap and is fixed in the same commit; `settle` already
      # uploaded.
      - name: Preserve the routing record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oc-route-${{ github.run_attempt }}-${{ inputs.issue_number }}
          path: .oc-receipts/*.json
          include-hidden-files: true
          if-no-files-found: error

  provider-free-worker:
    needs: classify
    if: needs.classify.outputs.provider_free == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      REPO: ${{ github.repository }}
      WAVE_HASH: ${{ inputs.wave_hash }}
      COMMANDS: ${{ needs.classify.outputs.commands }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: npm ci --ignore-scripts
      # No provider secret is present in this job, and none is forwarded to it.
      # The commands are chosen from a fixed registry, never from issue text.
      - name: Execute declared deterministic capabilities
        run: node scripts/oc-provider-free-execute.mjs
      # The routing record said what the lane decided; this one says what it
      # actually ran, with an exit code and output tail per command. Without the
      # upload it dies with the runner and `audit` cannot read it — the same
      # defect the classify job was just fixed for, one job over.
      - name: Preserve the execution receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oc-exec-${{ github.run_attempt }}-${{ inputs.issue_number }}
          path: .oc-receipts/*.json
          include-hidden-files: true
          if-no-files-found: error

  provider-worker:
    needs: budget-preflight
    if: inputs.provider_authorized && needs.budget-preflight.outputs.allowed == 'true' && needs.budget-preflight.outputs.lease_id != ''
    # A reusable-workflow call forwards whatever grant this job holds, so an
    # unset block here hands the called workflow all five workflow-level
    # permissions. It opens a draft pull request and comments, and that is all.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/orchid-completion-lane.yml
    with:
      issue_number: ${{ inputs.issue_number }}
      provider_authorized: ${{ inputs.provider_authorized }}
      lease_id: ${{ needs.budget-preflight.outputs.lease_id }}
      wave_hash: ${{ inputs.wave_hash }}
      artifact_name: ${{ inputs.artifact_name }}
    # No provider secrets are forwarded while the owner has prohibited paid execution.

  settle:
    needs: [budget-preflight, provider-worker]
    if: always() && needs.budget-preflight.outputs.lease_id != ''
    runs-on: ubuntu-latest
    # Releases the lease and refills capacity by relabelling issues. Nothing
    # here opens a pull request, dispatches a workflow, or needs an OIDC token.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact_name }}
          path: .oc-wave
      - name: Release fenced lease and immediately refill this capacity
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          OC_LEASE_ID: ${{ needs.budget-preflight.outputs.lease_id }}
          OC_WAVE_HASH: ${{ inputs.wave_hash }}
        run: npx --no-install tsx scripts/oc-dispatch-runtime.ts settle
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oc-lane-${{ github.run_attempt }}-${{ inputs.issue_number }}
          path: .oc-receipts/*.json
          include-hidden-files: true
          if-no-files-found: error
