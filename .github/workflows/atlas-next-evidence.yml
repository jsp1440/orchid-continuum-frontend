name: atlas-next evidence

on:
  push:
    branches: [feat/atlas-next-living-atlas]
    paths:
      - 'src/features/atlas-next/**'
      - 'src/pages/AtlasNext.tsx'
      - 'scripts/capture-atlas-next.mjs'
      - '.github/workflows/atlas-next-evidence.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      # The repo does not ship playwright; the script needs it resolvable as a
      # module, which `playwright install` alone does not provide.
      - run: npm i --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Serve and capture
        timeout-minutes: 60
        run: |
          set -o pipefail
          npx vite preview --port 4173 --host 127.0.0.1 &
          npx wait-on http://127.0.0.1:4173 -t 60000
          # Stamp the source commit into the log. File timestamps do not survive
          # a checkout, so this is the only durable answer to "which build are
          # these frames from?" — and a mixed-provenance evidence set must never
          # be presentable as one build.
          echo "[capture] commit $(git rev-parse HEAD)" | tee capture.log
          echo "[capture] captured $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a capture.log
          node scripts/capture-atlas-next.mjs 2>&1 | tee -a capture.log
      - name: Commit screenshots
        if: always()
        env:
          # The branch name is attacker-supplied. Interpolating it into
          # shell would let a branch called `x$(...)` run as this job.
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/evidence/atlas-next
          cp capture.log docs/evidence/atlas-next/capture-log.txt || true  # *.log is gitignored
          git add docs/evidence/atlas-next
          git diff --cached --quiet && exit 0
          git commit -m "chore(atlas-next): capture evidence from CI [skip ci]"
          # The branch may have moved on while the capture ran; rebase onto it
          # rather than clobbering newer work.
          git fetch origin "$REF_NAME"
          git rebase "origin/$REF_NAME" || git rebase --abort
          git push origin "HEAD:$REF_NAME" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: atlas-next-evidence
          path: docs/evidence/atlas-next
