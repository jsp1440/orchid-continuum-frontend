name: CALYX Multimodal Workspace Validation

on:
  pull_request:
    paths:
      - 'src/features/calyx-workspace/**'
      - 'src/components/lexicon/AskCalyx.tsx'
      - 'src/components/lexicon/EntryView.tsx'
      - 'src/pages/OrchidIdentificationNext.tsx'
      - 'src/lib/calyxService.ts'
      - '.github/workflows/calyx-multimodal-workspace-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused multimodal regressions
        run: npx vitest run src/features/calyx-workspace/sessionContext.test.ts src/features/calyx-workspace/workspaceOutputBus.test.ts src/features/calyx-workspace/identificationContext.test.ts
      - name: Build frontend
        run: npm run build
      - name: Lint changed workspace surfaces
        run: npx eslint src/features/calyx-workspace/sessionContext.ts src/features/calyx-workspace/sessionContext.test.ts src/features/calyx-workspace/workspaceOutputBus.ts src/features/calyx-workspace/workspaceOutputBus.test.ts src/features/calyx-workspace/identificationContext.ts src/features/calyx-workspace/identificationContext.test.ts src/features/calyx-workspace/WorkspaceOutputPanel.tsx src/features/calyx-workspace/CalyxAdaptiveWorkspace.tsx src/components/lexicon/AskCalyx.tsx src/components/lexicon/EntryView.tsx src/pages/OrchidIdentificationNext.tsx src/lib/calyxService.ts
      - name: Diff hygiene
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --check "origin/$BASE_REF...HEAD"
