name: CALYX Multimodal Workspace Validation

on:
  pull_request:
    paths:
      - 'src/features/calyx-workspace/**'
      - 'src/components/lexicon/AskCalyx.tsx'
      - 'src/components/lexicon/EntryView.tsx'
      - 'src/pages/OrchidIdentificationNext.tsx'
      - 'src/lib/calyxService.ts'
      - '.github/workflows/calyx-multimodal-workspace-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused multimodal regressions
        run: npx vitest run src/features/calyx-workspace/sessionContext.test.ts src/features/calyx-workspace/workspaceOutputBus.test.ts src/features/calyx-workspace/identificationContext.test.ts src/features/calyx-workspace/providerMode.test.ts
      - name: Build frontend
        run: npm run build
      - name: Lint changed workspace surfaces
        run: npx eslint src/features/calyx-workspace/sessionContext.ts src/features/calyx-workspace/sessionContext.test.ts src/features/calyx-workspace/workspaceOutputBus.ts src/features/calyx-workspace/workspaceOutputBus.test.ts src/features/calyx-workspace/identificationContext.ts src/features/calyx-workspace/identificationContext.test.ts src/features/calyx-workspace/providerMode.ts src/features/calyx-workspace/providerMode.test.ts src/features/calyx-workspace/CalyxProviderModeBadge.tsx src/features/calyx-workspace/WorkspaceOutputPanel.tsx src/features/calyx-workspace/WorkspaceOutputDock.tsx src/features/calyx-workspace/CalyxAdaptiveWorkspace.tsx src/features/calyx-workspace/MatrixCalyxChat.tsx src/components/lexicon/AskCalyx.tsx src/components/lexicon/EntryView.tsx src/pages/OrchidIdentificationNext.tsx src/lib/calyxService.ts
      - name: Diff hygiene
        run: git diff --check origin/${{ github.base_ref }}...HEAD
