name: Orchid Deterministic Dispatch

on:
  workflow_call:
    inputs:
      issues_json:
        required: true
        type: string
      wave_hash:
        required: true
        type: string
      artifact_name:
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

jobs:
  context-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node scripts/verify-autonomy-context.mjs

  lane:
    needs: context-contract
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        issue: ${{ fromJSON(inputs.issues_json) }}
    uses: ./.github/workflows/orchid-budgeted-completion-lane.yml
    secrets: inherit
    with:
      issue_number: ${{ format('{0}', matrix.issue) }}
      wave_hash: ${{ inputs.wave_hash }}
      artifact_name: ${{ inputs.artifact_name }}
      provider_authorized: true
