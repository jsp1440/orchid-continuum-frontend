name: Orchid Deterministic Dispatch

on:
  workflow_call:
    inputs:
      issues_json:
        required: true
        type: string
      wave_hash:
        required: true
        type: string
      artifact_name:
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

jobs:
  context-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node scripts/verify-autonomy-context.mjs

  lane:
    needs: context-contract
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        issue: ${{ fromJSON(inputs.issues_json) }}
    uses: ./.github/workflows/orchid-budgeted-completion-lane.yml
    with:
      issue_number: ${{ format('{0}', matrix.issue) }}
      wave_hash: ${{ inputs.wave_hash }}
      artifact_name: ${{ inputs.artifact_name }}
      provider_authorized: false
