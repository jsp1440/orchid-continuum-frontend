name: Orchid Continuous Completion

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  pull_request:
    types: [closed, synchronize, ready_for_review]
  issues:
    types: [closed, reopened]

concurrency:
  group: orchid-continuous-completion-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      refill_count: ${{ steps.state.outputs.refill_count }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      INTEGRATION_BRANCH: oc-autonomous-integration
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure labels and integration branch
        shell: bash
        run: |
          set -euo pipefail
          ensure_label () {
            local name="$1" color="$2" description="$3"
            gh label create "$name" --repo "$REPO" --color "$color" --description "$description" 2>/dev/null || true
          }
          ensure_label oc-queued 1d76db "Eligible for autonomous Orchid Continuum execution"
          ensure_label oc-running fbca04 "Currently assigned to an autonomous execution lane"
          ensure_label oc-validating 8250df "Autonomous implementation delivered; CI/integration supervisor owns next transition"
          ensure_label oc-owner-gate d93f0b "Integrated batch is ready for an owner-gated main merge/deploy decision"
          ensure_label oc-blocked b60205 "Externally blocked; does not consume an execution lane"
          ensure_label oc-done 0e8a16 "Acceptance criteria completed"
          ensure_label oc-auto-generated 5319e7 "Generated by the autonomous backlog planner"

          git config user.name "orchid-continuum-orchestrator[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main "$INTEGRATION_BRANCH" || git fetch origin main
          if git show-ref --verify --quiet "refs/remotes/origin/$INTEGRATION_BRANCH"; then
            git checkout -B "$INTEGRATION_BRANCH" "origin/$INTEGRATION_BRANCH"
          else
            git checkout -B "$INTEGRATION_BRANCH" origin/main
          fi

          if ! git merge --no-edit origin/main; then
            git merge --abort
            echo "Integration branch could not absorb current main automatically; worker lanes can continue on its last safe head." >&2
          else
            git push origin "HEAD:$INTEGRATION_BRANCH"
          fi

      - name: Supervise autonomous PRs and recover stale slots
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t running < <(gh issue list --repo "$REPO" --state open --label oc-running --limit 100 --json number,updatedAt --jq '.[] | "\(.number) \(.updatedAt)"')
          now=$(date -u +%s)
          for row in "${running[@]}"; do
            issue=${row%% *}
            updated=${row#* }
            updated_epoch=$(date -u -d "$updated" +%s || echo "$now")
            age=$((now - updated_epoch))
            if (( age > 5700 )); then
              marker="OC-AUTO-ISSUE: #${issue}"
              # Not `| head -1`. Under `set -o pipefail` head exits after one line,
              # gh takes SIGPIPE once its output exceeds the 64KB pipe buffer, the
              # pipeline returns 141 and `set -e` kills the whole step. With several
              # long-bodied OC-AUTO PRs open that is every run - which is exactly
              # when this supervisor is most needed.
              durable=$(gh pr list --repo "$REPO" --state open --limit 100 --json number,body --jq ".[] | select(.body != null and (.body | contains(\"$marker\"))) | .number" || true)
              durable=${durable%%$'\n'*}
              if [[ -z "$durable" ]]; then
                gh issue edit "$issue" --repo "$REPO" --remove-label oc-running --add-label oc-queued >/dev/null 2>&1 || true
              fi
            fi
          done

          mapfile -t prs < <(gh pr list --repo "$REPO" --state open --base "$INTEGRATION_BRANCH" --limit 100 --json number,body --jq '.[] | select(.body != null and (.body | contains("OC-AUTO-ISSUE: #"))) | .number')
          for pr in "${prs[@]}"; do
            data=$(gh pr view "$pr" --repo "$REPO" --json body,isDraft,mergeStateStatus,headRefName,headRefOid)
            body=$(jq -r '.body // ""' <<<"$data")
            issue=$(sed -n 's/.*OC-AUTO-ISSUE: #\([0-9][0-9]*\).*/\1/p' <<<"$body" || true)
            issue=${issue%%$'\n'*}
            [[ -n "$issue" ]] || continue

            gh issue edit "$issue" --repo "$REPO" --remove-label oc-running --remove-label oc-queued --add-label oc-validating >/dev/null 2>&1 || true

            head=$(jq -r '.headRefName' <<<"$data")
            head_sha=$(jq -r '.headRefOid' <<<"$data")
            # No --event filter. Both workflows trigger on pull_request, so filtering
            # to workflow_dispatch matched nothing, ci and matrix were always empty,
            # and the `[[ -n "$ci" && -n "$matrix" ]] || continue` below skipped every
            # pull request. The supervisor could not advance anything, ever.
            ci_runs=$(gh run list --repo "$REPO" --workflow frontend-ci.yml --branch "$head" --limit 20 --json headSha,status,conclusion 2>/dev/null || echo '[]')
            matrix_runs=$(gh run list --repo "$REPO" --workflow calyx-matrix-005-validation.yml --branch "$head" --limit 20 --json headSha,status,conclusion 2>/dev/null || echo '[]')
            ci=$(jq -r --arg sha "$head_sha" '[.[] | select(.headSha == $sha)][0] | if . then [.status, (.conclusion // "")] | join(" ") else "" end' <<<"$ci_runs")
            matrix=$(jq -r --arg sha "$head_sha" '[.[] | select(.headSha == $sha)][0] | if . then [.status, (.conclusion // "")] | join(" ") else "" end' <<<"$matrix_runs")

            [[ -n "$ci" && -n "$matrix" ]] || continue
            [[ "$ci" == completed* && "$matrix" == completed* ]] || continue
            if [[ "$ci" != "completed success" || "$matrix" != "completed success" ]]; then
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --add-label oc-queued >/dev/null 2>&1 || true
              continue
            fi

            merge_state=$(jq -r '.mergeStateStatus' <<<"$data")
            if [[ "$merge_state" == "BEHIND" ]]; then
              gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" >/dev/null 2>&1 || true
              continue
            fi
            if [[ "$merge_state" == "DIRTY" ]]; then
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --add-label oc-queued >/dev/null 2>&1 || true
              continue
            fi

            if [[ $(jq -r '.isDraft' <<<"$data") == "true" ]]; then
              gh pr ready "$pr" --repo "$REPO" >/dev/null
            fi

            if gh pr merge "$pr" --repo "$REPO" --squash --delete-branch=false >/dev/null; then
              requeue=false
              blocked=false
              grep -Eiq '^OC-AUTO-REQUEUE:[[:space:]]*true[[:space:]]*$' <<<"$body" && requeue=true || true
              grep -Eiq '^OC-AUTO-BLOCKED:[[:space:]]*true[[:space:]]*$' <<<"$body" && blocked=true || true

              gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --remove-label oc-running --remove-label oc-queued >/dev/null 2>&1 || true
              if [[ "$blocked" == "true" ]]; then
                gh issue edit "$issue" --repo "$REPO" --add-label oc-blocked >/dev/null 2>&1 || true
              elif [[ "$requeue" == "true" ]]; then
                gh issue edit "$issue" --repo "$REPO" --add-label oc-queued >/dev/null 2>&1 || true
              else
                gh issue edit "$issue" --repo "$REPO" --add-label oc-done >/dev/null 2>&1 || true
                gh issue close "$issue" --repo "$REPO" --comment "[OC-AUTO] Acceptance slice integrated into $INTEGRATION_BRANCH after CI passed. Main/production remains owner-gated." >/dev/null 2>&1 || true
              fi
            fi
          done

      - name: Seed curated backlog and calculate refill requirement
        id: state
        shell: bash
        run: |
          set -euo pipefail
          BACKLOG=(188 189 131 170 169 167 171 163 168 166 165 85 89 93 87)

          for issue in "${BACKLOG[@]}"; do
            state=$(gh issue view "$issue" --repo "$REPO" --json state --jq '.state' 2>/dev/null || echo MISSING)
            [[ "$state" == "OPEN" ]] || continue
            labels=$(gh issue view "$issue" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")')
            if [[ "$labels" != *"oc-queued"* && "$labels" != *"oc-running"* && "$labels" != *"oc-validating"* && "$labels" != *"oc-owner-gate"* && "$labels" != *"oc-blocked"* && "$labels" != *"oc-done"* ]]; then
              gh issue edit "$issue" --repo "$REPO" --add-label oc-queued >/dev/null
            fi
          done

          queued=$(gh issue list --repo "$REPO" --state open --label oc-queued --limit 200 --json number --jq 'length')
          running=$(gh issue list --repo "$REPO" --state open --label oc-running --limit 200 --json number --jq 'length')
          validating=$(gh issue list --repo "$REPO" --state open --label oc-validating --limit 200 --json number --jq 'length')
          actionable=$((queued + running + validating))
          refill=0
          if (( actionable < 6 )); then
            refill=$((6 - actionable))
          fi
          echo "refill_count=$refill" >> "$GITHUB_OUTPUT"

  planner:
    needs: inventory
    if: needs.inventory.outputs.refill_count != '0'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REFILL_COUNT: ${{ needs.inventory.outputs.refill_count }}
    steps:
      - name: Checkout integration branch for system inspection
        uses: actions/checkout@v4
        with:
          ref: oc-autonomous-integration
          fetch-depth: 0

      - name: Generate only the next missing bounded work items
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            ORCHID CONTINUUM — AUTONOMOUS BACKLOG REFILL

            The continuous completion queue has fewer than two full waves of work.
            Create exactly ${{ needs.inventory.outputs.refill_count }} new bounded implementation issue(s), unless existing open issues already cover the same work.

            This is a control-plane task, not an architecture-writing exercise.
            Inspect current main, `oc-autonomous-integration`, open PRs/issues, failing CI, TODOs exposed by tests, and the actual public NAOCC path.

            Priority order:
            1. production/demo-breaking failures and failed CI;
            2. canonical Continuum / knowledge-evidence integration gaps;
            3. Genus of the Day, Species Dossier, Atlas, Calyx, Research Station, University, Conservation continuity;
            4. scientific provenance, unknown/unavailable/conflicting/imprecise/withheld semantics;
            5. module completion and maintainability defects with concrete acceptance criteria.

            For every new issue:
            - make it a small implementation-sized vertical slice, not a blueprint;
            - include concrete acceptance criteria and validation expectations;
            - never ask the frontend to invent science;
            - add labels `oc-queued` and `oc-auto-generated`;
            - include marker `OC-AUTO-GENERATED` in the body;
            - avoid duplicate or overlapping issues.

            Do not edit product code in this planner step. Do not merge or deploy.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 30
            --allowedTools "Read,Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git ls-files:*),Bash(gh issue:*),Bash(gh pr:*),Bash(gh run:*)"

  prepare:
    needs: [inventory, planner]
    if: always() && needs.inventory.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      issue1: ${{ steps.queue.outputs.issue1 }}
      issue2: ${{ steps.queue.outputs.issue2 }}
      issue3: ${{ steps.queue.outputs.issue3 }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Fill three execution slots in priority order
        id: queue
        shell: bash
        run: |
          set -euo pipefail
          BACKLOG=(188 189 131 170 169 167 171 163 168 166 165 85 89 93 87)
          selected=()

          has_selected () {
            local candidate="$1"
            for current in "${selected[@]:-}"; do
              [[ "$current" == "$candidate" ]] && return 0
            done
            return 1
          }

          for issue in "${BACKLOG[@]}"; do
            (( ${#selected[@]} >= 3 )) && break
            labels=$(gh issue view "$issue" --repo "$REPO" --json state,labels --jq 'select(.state == "OPEN") | [.labels[].name] | join(" ")' 2>/dev/null || true)
            [[ "$labels" == *"oc-queued"* ]] || continue
            selected+=("$issue")
          done

          if (( ${#selected[@]} < 3 )); then
            mapfile -t extras < <(gh issue list --repo "$REPO" --state open --label oc-queued --limit 200 --json number,createdAt --jq 'sort_by(.createdAt) | .[].number')
            for issue in "${extras[@]}"; do
              (( ${#selected[@]} >= 3 )) && break
              has_selected "$issue" && continue
              selected+=("$issue")
            done
          fi

          for idx in 0 1 2; do
            value="${selected[$idx]:-}"
            if [[ -n "$value" ]]; then
              gh issue edit "$value" --repo "$REPO" --remove-label oc-queued --remove-label oc-validating --add-label oc-running >/dev/null
            fi
            echo "issue$((idx+1))=$value" >> "$GITHUB_OUTPUT"
          done

  lane1:
    needs: prepare
    if: needs.prepare.outputs.issue1 != ''
    uses: ./.github/workflows/orchid-completion-lane.yml
    with:
      issue_number: ${{ needs.prepare.outputs.issue1 }}
    secrets: inherit

  lane2:
    needs: prepare
    if: needs.prepare.outputs.issue2 != ''
    uses: ./.github/workflows/orchid-completion-lane.yml
    with:
      issue_number: ${{ needs.prepare.outputs.issue2 }}
    secrets: inherit

  lane3:
    needs: prepare
    if: needs.prepare.outputs.issue3 != ''
    uses: ./.github/workflows/orchid-completion-lane.yml
    with:
      issue_number: ${{ needs.prepare.outputs.issue3 }}
    secrets: inherit

  publish-owner-gate:
    needs: [lane1, lane2, lane3]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      INTEGRATION_BRANCH: oc-autonomous-integration
    steps:
      - name: Keep one integration-to-main owner gate available
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Open or refresh the autonomous integration batch PR
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$INTEGRATION_BRANCH" || exit 0
          ahead=$(git rev-list --count "origin/main..origin/$INTEGRATION_BRANCH")
          (( ahead > 0 )) || exit 0

          existing=$(gh pr list --repo "$REPO" --state open --base main --head "$INTEGRATION_BRANCH" --json number --jq '.[0].number // empty')
          body=$(cat <<EOF
          Autonomously validated integration batch from $INTEGRATION_BRANCH.

          This PR is the deliberate owner gate between the continuous improvement system and production-facing main.

          - Worker PRs are merged automatically only into the integration branch after CI passes.
          - Scientific/provenance safeguards remain mandatory.
          - This PR must not be auto-merged by the orchestrator.
          - Production deployment remains a separate explicit owner decision.

          OC-AUTO-INTEGRATION-GATE
          EOF
          )

          if [[ -z "$existing" ]]; then
            gh pr create --repo "$REPO" --base main --head "$INTEGRATION_BRANCH" --draft --title "OC autonomous integration batch" --body "$body" >/dev/null
            existing=$(gh pr list --repo "$REPO" --state open --base main --head "$INTEGRATION_BRANCH" --json number --jq '.[0].number // empty')
          else
            gh pr edit "$existing" --repo "$REPO" --body "$body" >/dev/null
          fi
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --repo "$REPO" --add-label oc-owner-gate >/dev/null 2>&1 || true
          fi
