name: Orchid Continuous Completion (NO API MODE)

# Canonical scheduler. Compatibility entrypoints delegate here; Portfolio
# Steward remains a separate queue-planning role, outside implementation capacity.
on:
  schedule:
    - cron: '*/5 * * * *'
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

env:
  MAX_ACTIVE_LANES: 8
  PROVIDER_AUTHORIZED: 'false'

jobs:
  reconcile:
    name: Reconcile expired leases against hosted run evidence
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: read
    concurrency:
      group: orchid-lease-reconciliation-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - env:
          GH_TOKEN: ${{ github.token }}
        run: npx --no-install tsx scripts/oc-dispatch-runtime.ts reconcile

  plan:
    needs: reconcile
    if: always() && (needs.reconcile.result == 'success' || needs.reconcile.result == 'skipped')
    name: Graph admission and shared wave
    runs-on: ubuntu-latest
    concurrency:
      group: orchid-dispatch-plan-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      issues: ${{ steps.plan.outputs.issues }}
      wave_hash: ${{ steps.plan.outputs.wave_hash }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - name: Read complete inventory and rank canonical graph leaves
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx --no-install tsx scripts/oc-dispatch-runtime.ts plan
      - name: Preserve hash-addressed shared context
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oc-wave-${{ github.run_attempt }}
          path: .oc-wave/*.json
          include-hidden-files: true
          if-no-files-found: error

  dispatch:
    needs: plan
    if: needs.plan.outputs.issues != '[]'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      id-token: write
    uses: ./.github/workflows/orchid-deterministic-dispatch.yml
    with:
      issues_json: ${{ needs.plan.outputs.issues }}
      wave_hash: ${{ needs.plan.outputs.wave_hash }}
      artifact_name: oc-wave-${{ github.run_attempt }}

  audit:
    name: Reconcile admitted plan with lane receipts
    needs: [plan, dispatch]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.issues != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: oc-wave-${{ github.run_attempt }}
          path: .oc-wave
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: oc-lane-${{ github.run_attempt }}-*
          path: .oc-receipts
          merge-multiple: true
      - env:
          OC_WAVE_HASH: ${{ needs.plan.outputs.wave_hash }}
        run: npx --no-install tsx scripts/oc-dispatch-runtime.ts audit
