name: Orchid Continuous Completion — SAFE MODE

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  pull_request:
    types: [closed, synchronize, ready_for_review]
  issues:
    types: [closed, reopened]

concurrency:
  group: orchid-continuous-completion-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  safe-mode:
    runs-on: ubuntu-latest
    steps:
      - name: Provider circuit breaker
        shell: bash
        run: |
          echo "Orchid Continuous Completion is in SAFE MODE."
          echo "Paid model execution is disabled after the 2026-09-04/05 provider-spend/suspension incident."
          echo "This scheduled workflow intentionally performs zero Anthropic, Gemini, or OpenAI provider calls."
          echo "Restore autonomous provider execution only after budget-aware batching, cooldowns, fingerprints, and hard circuit breakers are implemented and validated."
          {
            echo "### Orchid provider circuit breaker"
            echo
            echo "- Paid model calls: **DISABLED**"
            echo "- Scheduled provider retries: **0**"
            echo "- Anthropic suspension bypass: **NOT ATTEMPTED**"
            echo "- Re-enable condition: validated cost-governor + explicit provider recovery"
          } >> "$GITHUB_STEP_SUMMARY"
