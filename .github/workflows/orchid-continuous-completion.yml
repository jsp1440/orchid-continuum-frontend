name: Orchid Continuous Completion

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  pull_request:
    types: [closed, synchronize, ready_for_review]
  issues:
    types: [closed, reopened]

concurrency:
  group: orchid-continuous-completion-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      refill_count: ${{ steps.state.outputs.refill_count }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      INTEGRATION_BRANCH: oc-autonomous-integration
      MAX_ACTIVE_LANES: 2
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure labels and integration branch
        shell: bash
        run: |
          set -euo pipefail
          ensure_label () {
            local name="$1" color="$2" description="$3"
            gh label create "$name" --repo "$REPO" --color "$color" --description "$description" 2>/dev/null || true
          }
          ensure_label oc-queued 1d76db "Eligible for autonomous Orchid Continuum execution"
          ensure_label oc-running fbca04 "Currently assigned to an autonomous execution lane"
          ensure_label oc-validating 8250df "Autonomous implementation delivered; CI/integration supervisor owns next transition"
          ensure_label oc-repair bfd4f2 "Exact-head CI or merge conflict authorizes one bounded repair pass"
          ensure_label oc-owner-gate d93f0b "Integrated batch awaits a protected policy/main decision"
          ensure_label oc-blocked b60205 "Externally blocked; does not consume an execution lane"
          ensure_label oc-done 0e8a16 "Acceptance criteria completed"
          ensure_label oc-auto-generated 5319e7 "Generated by the autonomous backlog planner"
          ensure_label oc-runtime-backoff 6e7781 "Worker parked until provider or material work state changes"
          ensure_label oc-p0 b60205 "Portfolio priority P0 — completion/control-plane critical"
          ensure_label oc-p1 d93f0b "Portfolio priority P1 — core scientific/product integration"
          ensure_label oc-p2 fbca04 "Portfolio priority P2 — major application completion"
          ensure_label oc-p3 1d76db "Portfolio priority P3 — federation/data expansion"
          ensure_label oc-p4 8250df "Portfolio priority P4 — operational completion"
          ensure_label oc-p5 6e7781 "Portfolio priority P5 — idle-capacity enrichment"

          git config user.name "orchid-continuum-orchestrator[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main "$INTEGRATION_BRANCH" || git fetch origin main
          if git show-ref --verify --quiet "refs/remotes/origin/$INTEGRATION_BRANCH"; then
            git checkout -B "$INTEGRATION_BRANCH" "origin/$INTEGRATION_BRANCH"
          else
            git checkout -B "$INTEGRATION_BRANCH" origin/main
          fi

          if ! git merge --no-edit origin/main; then
            git merge --abort
            echo "Integration branch could not absorb current main automatically; worker lanes can continue on its last safe head." >&2
          else
            git push origin "HEAD:$INTEGRATION_BRANCH"
          fi

      - name: Supervise autonomous PRs and recover stale slots
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          mapfile -t running < <(gh issue list --repo "$REPO" --state open --label oc-running --limit 200 --json number,updatedAt --jq '.[] | "\(.number) \(.updatedAt)"')
          for row in "${running[@]:-}"; do
            [[ -n "$row" ]] || continue
            issue=${row%% *}
            updated=${row#* }
            updated_epoch=$(date -u -d "$updated" +%s 2>/dev/null || echo "$now")
            age=$((now - updated_epoch))
            (( age > 4800 )) || continue
            marker="OC-AUTO-ISSUE: #${issue}"
            durable=$(gh pr list --repo "$REPO" --state open --base "$INTEGRATION_BRANCH" --limit 500 --json number,body --jq "[.[] | select(.body != null and (.body | contains(\"$marker\")))][0].number // empty" || true)
            gh issue edit "$issue" --repo "$REPO" --remove-label oc-running --remove-label oc-repair >/dev/null 2>&1 || true
            if [[ -n "$durable" ]]; then
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-queued --add-label oc-validating >/dev/null 2>&1 || true
            else
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --add-label oc-queued >/dev/null 2>&1 || true
            fi
          done

          mapfile -t prs < <(gh pr list --repo "$REPO" --state open --base "$INTEGRATION_BRANCH" --limit 500 --json number,body --jq '.[] | select(.body != null and (.body | contains("OC-AUTO-ISSUE: #"))) | .number')
          for pr in "${prs[@]:-}"; do
            [[ -n "$pr" ]] || continue
            data=$(gh pr view "$pr" --repo "$REPO" --json body,isDraft,mergeStateStatus,headRefName,headRefOid)
            body=$(jq -r '.body // ""' <<<"$data")
            issue=$(sed -n 's/.*OC-AUTO-ISSUE: #\([0-9][0-9]*\).*/\1/p' <<<"$body" || true)
            issue=${issue%%$'\n'*}
            [[ -n "$issue" ]] || continue

            labels=$(gh issue view "$issue" --repo "$REPO" --json state,labels --jq 'select(.state == "OPEN") | [.labels[].name] | join(" ")' 2>/dev/null || true)
            [[ -n "$labels" ]] || continue
            [[ "$labels" == *oc-running* ]] && continue
            gh issue edit "$issue" --repo "$REPO" --remove-label oc-queued --add-label oc-validating >/dev/null 2>&1 || true

            head=$(jq -r '.headRefName' <<<"$data")
            head_sha=$(jq -r '.headRefOid' <<<"$data")
            ci_runs=$(gh run list --repo "$REPO" --workflow frontend-ci.yml --branch "$head" --limit 20 --json headSha,status,conclusion 2>/dev/null || echo '[]')
            matrix_runs=$(gh run list --repo "$REPO" --workflow calyx-matrix-005-validation.yml --branch "$head" --limit 20 --json headSha,status,conclusion 2>/dev/null || echo '[]')
            ci=$(jq -r --arg sha "$head_sha" '[.[] | select(.headSha == $sha)][0] | if . then [.status, (.conclusion // "")] | join(" ") else "" end' <<<"$ci_runs")
            matrix=$(jq -r --arg sha "$head_sha" '[.[] | select(.headSha == $sha)][0] | if . then [.status, (.conclusion // "")] | join(" ") else "" end' <<<"$matrix_runs")

            if [[ -z "$ci" ]]; then
              gh workflow run frontend-ci.yml --repo "$REPO" --ref "$head" >/dev/null 2>&1 || true
            fi
            if [[ -z "$matrix" ]]; then
              gh workflow run calyx-matrix-005-validation.yml --repo "$REPO" --ref "$head" >/dev/null 2>&1 || true
            fi
            [[ -n "$ci" && -n "$matrix" ]] || continue
            [[ "$ci" == completed* && "$matrix" == completed* ]] || continue
            if [[ "$ci" != "completed success" || "$matrix" != "completed success" ]]; then
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --add-label oc-queued --add-label oc-repair >/dev/null 2>&1 || true
              continue
            fi

            merge_state=$(jq -r '.mergeStateStatus' <<<"$data")
            if [[ "$merge_state" == "BEHIND" ]]; then
              gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" >/dev/null 2>&1 || true
              continue
            fi
            if [[ "$merge_state" == "DIRTY" ]]; then
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --add-label oc-queued --add-label oc-repair >/dev/null 2>&1 || true
              continue
            fi

            if [[ $(jq -r '.isDraft' <<<"$data") == "true" ]]; then
              gh pr ready "$pr" --repo "$REPO" >/dev/null 2>&1 || true
            fi

            if gh pr merge "$pr" --repo "$REPO" --squash --delete-branch=false >/dev/null 2>&1; then
              requeue=false
              blocked=false
              grep -Eiq '^OC-AUTO-REQUEUE:[[:space:]]*true[[:space:]]*$' <<<"$body" && requeue=true || true
              grep -Eiq '^OC-AUTO-BLOCKED:[[:space:]]*true[[:space:]]*$' <<<"$body" && blocked=true || true
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --remove-label oc-running --remove-label oc-queued --remove-label oc-repair >/dev/null 2>&1 || true
              if [[ "$blocked" == true ]]; then
                gh issue edit "$issue" --repo "$REPO" --add-label oc-blocked >/dev/null 2>&1 || true
              elif [[ "$requeue" == true ]]; then
                gh issue edit "$issue" --repo "$REPO" --add-label oc-queued >/dev/null 2>&1 || true
              else
                gh issue edit "$issue" --repo "$REPO" --add-label oc-done >/dev/null 2>&1 || true
                gh issue close "$issue" --repo "$REPO" --comment "[OC-AUTO] Acceptance slice integrated into $INTEGRATION_BRANCH after exact-head CI passed. Main/production remains protected by governance." >/dev/null 2>&1 || true
              fi
            fi
          done

      - name: Heal queue invariants and calculate refill requirement
        id: state
        shell: bash
        run: |
          set -euo pipefail

          # Heal oc-repair issues that are stuck without a runnable label
          mapfile -t repairs < <(gh issue list --repo "$REPO" --state open --label oc-repair --limit 200 --json number --jq '.[].number')
          for issue in "${repairs[@]:-}"; do
            [[ -n "$issue" ]] || continue
            labels=$(gh issue view "$issue" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")' 2>/dev/null || true)
            if [[ "$labels" == *oc-repair* && "$labels" != *oc-running* && "$labels" != *oc-queued* ]]; then
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --add-label oc-queued >/dev/null 2>&1 || true
            fi
          done

          # Enforce mutual exclusion: oc-queued cannot coexist with oc-running,
          # oc-validating, oc-runtime-backoff, or oc-repair-backoff.
          heal_errors=0
          mapfile -t queued_issues < <(gh issue list --repo "$REPO" --state open --label oc-queued --limit 500 --json number --jq '.[].number')
          for issue in "${queued_issues[@]:-}"; do
            [[ -n "$issue" ]] || continue
            labels=$(gh issue view "$issue" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")' 2>/dev/null || true)
            [[ -n "$labels" ]] || continue
            conflict=""
            [[ "$labels" == *oc-running* ]] && conflict="oc-running"
            [[ "$labels" == *oc-validating* && -z "$conflict" ]] && conflict="oc-validating"
            [[ "$labels" == *oc-runtime-backoff* && -z "$conflict" ]] && conflict="oc-runtime-backoff"
            [[ "$labels" == *oc-repair-backoff* && -z "$conflict" ]] && conflict="oc-repair-backoff"
            [[ -z "$conflict" ]] && continue
            echo "::warning::Healer: issue #${issue} has oc-queued + ${conflict} (invariant violation). Removing oc-queued."
            if gh issue edit "$issue" --repo "$REPO" --remove-label oc-queued >/dev/null 2>&1; then
              labels_after=$(gh issue view "$issue" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")' 2>/dev/null || true)
              if [[ "$labels_after" == *oc-queued* ]] && \
                 [[ "$labels_after" == *oc-running* || "$labels_after" == *oc-validating* || \
                    "$labels_after" == *oc-runtime-backoff* || "$labels_after" == *oc-repair-backoff* ]]; then
                echo "::error::Healer: issue #${issue} invariant violation persists after repair; failing closed."
                heal_errors=$(( heal_errors + 1 ))
              fi
            else
              echo "::error::Healer: could not remove oc-queued from issue #${issue}; failing closed."
              heal_errors=$(( heal_errors + 1 ))
            fi
          done
          (( heal_errors == 0 )) || exit 1

          queued=$(gh issue list --repo "$REPO" --state open --label oc-queued --limit 500 --json number --jq 'length')
          running=$(gh issue list --repo "$REPO" --state open --label oc-running --limit 200 --json number --jq 'length')
          validating=$(gh issue list --repo "$REPO" --state open --label oc-validating --limit 200 --json number --jq 'length')
          actionable=$((queued + running + validating))
          refill=0
          if (( actionable < 10 )); then
            refill=$((10 - actionable))
          fi
          echo "refill_count=$refill" >> "$GITHUB_OUTPUT"

  planner:
    needs: inventory
    if: needs.inventory.outputs.refill_count != '0'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REFILL_COUNT: ${{ needs.inventory.outputs.refill_count }}
    steps:
      - name: Checkout integration branch for system inspection
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: oc-autonomous-integration
          fetch-depth: 0

      - name: Generate only the next missing bounded work items
        continue-on-error: true
        uses: anthropics/claude-code-action@c81e3bc69d1b18badbb63ba39581218f02421678 # v1.0.201
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            ORCHID CONTINUUM — AUTONOMOUS PORTFOLIO REFILL

            The frontend completion portfolio has fewer than two full waves of eligible work.
            Create exactly ${{ needs.inventory.outputs.refill_count }} bounded implementation issue(s), unless existing open issues already cover the same acceptance work.

            Inspect current main, `oc-autonomous-integration`, open PRs/issues, failing CI, and the canonical Orchid Continuum Brain completion portfolio before creating anything.

            Priority order:
            P0 production/demo or autonomy-control-plane failures;
            P1 canonical knowledge/evidence integration and Calyx teaching/reasoning continuity;
            P2 major module completion: Featured Genus, Atlas, Research Station, University, Matrix, Vision, Conservatory/OASIS, Buying Companion, Species Dossier;
            P3 federation/data-source experience;
            P4 operations/accessibility/responsive completion;
            P5 idle-capacity enrichment only.

            For each genuinely missing issue, make it an implementation-sized vertical slice, add `oc-queued` and `oc-auto-generated`, prefix the title with P0..P5, preserve scientific/provenance/locality safeguards, and avoid duplicates. Do not edit product code, merge, or deploy in this planner step.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 30
            --allowedTools "Read,Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git ls-files:*),Bash(gh issue:*),Bash(gh pr:*),Bash(gh run:*)"

      - name: Diagnose the Claude run
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/diagnose-claude-run.mjs

      - name: Enforce planner provider failure policy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LOG="${CLAUDE_EXECUTION_LOG:-/home/runner/work/_temp/claude-execution-output.json}"
          if [[ ! -f "$LOG" ]]; then
            echo "::error::Planner provider evidence is missing or malformed; failing closed."
            exit 1
          fi
          result_json=$(jq '(if type == "array" then . else [.] end) | [.[] | objects | select(.type == "result")] | last // empty' "$LOG" 2>/dev/null || true)
          if [[ -z "$result_json" ]]; then
            echo "::error::Planner provider evidence has no result record; failing closed."
            exit 1
          fi
          is_error=$(jq -r '.is_error // false' <<<"$result_json")
          if [[ "$is_error" != "true" ]]; then
            echo "Planner provider health is good."
            exit 0
          fi
          cause=$(jq -r '.provider_failure_cause // ""' <<<"$result_json")
          case "$cause" in
            ANTHROPIC_CREDIT_EXHAUSTED|ANTHROPIC_RATE_LIMITED|ANTHROPIC_PROVIDER_ERROR)
              echo "::warning::Planner provider is degraded ($cause); existing governed completion work may continue without refill."
              exit 0
              ;;
            *)
              echo "::error::Planner provider failure is not a safe capacity degradation: ${cause:-UNSAFE_OR_UNCLASSIFIED_PROVIDER_FAILURE}"
              exit 1
              ;;
          esac

  prepare:
    needs: [inventory, planner]
    if: always() && needs.inventory.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      issue1: ${{ steps.queue.outputs.issue1 }}
      issue2: ${{ steps.queue.outputs.issue2 }}
      issue3: ${{ steps.queue.outputs.issue3 }}
      issue4: ${{ steps.queue.outputs.issue4 }}
      issue5: ${{ steps.queue.outputs.issue5 }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      INTEGRATION_BRANCH: oc-autonomous-integration
      MAX_ACTIVE_LANES: 2
    steps:
      - name: Fill available execution slots from priority portfolio
        id: queue
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          running=$(gh issue list --repo "$REPO" --state open --label oc-running --limit 200 --json number --jq 'length')
          capacity=$(( MAX_ACTIVE_LANES - running ))
          (( capacity > 0 )) || capacity=0

          priority_of () {
            local title="$1" labels="$2"
            for p in 0 1 2 3 4 5; do
              if [[ "$labels" == *"oc-p${p}"* || "$title" =~ ^P${p}([[:space:]:-]|$) ]]; then
                echo "$p"
                return
              fi
            done
            echo 6
          }

          mapfile -t encoded < <(gh issue list --repo "$REPO" --state open --label oc-queued --limit 500 --json number,title,createdAt,labels --jq '.[] | @base64')
          candidates=()
          for item in "${encoded[@]:-}"; do
            [[ -n "$item" ]] || continue
            obj=$(base64 --decode <<<"$item")
            issue=$(jq -r '.number' <<<"$obj")
            title=$(jq -r '.title // ""' <<<"$obj")
            created=$(jq -r '.createdAt' <<<"$obj")
            labels=$(jq -r '[.labels[].name] | join(" ")' <<<"$obj")
            [[ "$labels" == *oc-validating* || "$labels" == *oc-blocked* || "$labels" == *oc-owner-gate* || "$labels" == *oc-done* ]] && continue
            base=$(priority_of "$title" "$labels")
            epoch=$(date -u -d "$created" +%s 2>/dev/null || echo "$now")
            age=$(( now - epoch ))
            effective=$base
            if (( age >= 259200 && effective > 0 )); then
              effective=$(( effective - 1 ))
            fi
            candidates+=("${effective}|${created}|${issue}")
          done

          mapfile -t ranked < <(printf '%s\n' "${candidates[@]:-}" | sed '/^$/d' | sort -t'|' -k1,1n -k2,2 -k3,3n)
          output=1
          for row in "${ranked[@]:-}"; do
            (( output > capacity )) && break
            issue=${row##*|}
            labels=$(gh issue view "$issue" --repo "$REPO" --json state,labels --jq 'select(.state == "OPEN") | [.labels[].name] | join(" ")' 2>/dev/null || true)
            [[ "$labels" == *oc-queued* ]] || continue
            [[ "$labels" != *oc-running* && "$labels" != *oc-validating* && "$labels" != *oc-runtime-backoff* && "$labels" != *oc-repair-backoff* ]] || continue

            repair=false
            [[ "$labels" == *oc-repair* ]] && repair=true
            marker="OC-AUTO-ISSUE: #${issue}"
            durable=$(gh pr list --repo "$REPO" --state open --base "$INTEGRATION_BRANCH" --limit 500 --json number,body,headRefOid --jq "[.[] | select(.body != null and (.body | contains(\"$marker\")))][0] // empty" || true)
            if [[ -n "$durable" && "$repair" != true ]]; then
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-queued --remove-label oc-running --add-label oc-validating >/dev/null 2>&1 || true
              continue
            fi
            if [[ -n "$durable" ]]; then
              durable_pr=$(jq -r '.number' <<<"$durable")
              durable_sha=$(jq -r '.headRefOid' <<<"$durable")
              fingerprint="issue=${issue};pr=${durable_pr};head=${durable_sha};mode=repair"
              if gh api --paginate "repos/$REPO/issues/$issue/comments?per_page=100" --jq '.[].body // ""' 2>/dev/null | grep -Fqx "[OC-AUTO-FINGERPRINT] ${fingerprint}"; then
                seen=true
              else
                seen=false
              fi
              if [[ "$seen" == true ]]; then
                gh issue edit "$issue" --repo "$REPO" --remove-label oc-queued --remove-label oc-running --remove-label oc-repair --remove-label oc-validating --add-label oc-runtime-backoff >/dev/null 2>&1 || true
                continue
              fi
              gh issue comment "$issue" --repo "$REPO" --body "[OC-AUTO-FINGERPRINT] ${fingerprint}" >/dev/null || continue
            fi

            gh issue edit "$issue" --repo "$REPO" --remove-label oc-queued --remove-label oc-validating --remove-label oc-runtime-backoff --add-label oc-running >/dev/null || continue
            lease=$(gh issue view "$issue" --repo "$REPO" --json state,labels --jq 'select(.state == "OPEN") | [.labels[].name] | join(" ")' 2>/dev/null || true)
            [[ "$lease" == *oc-running* && "$lease" != *oc-queued* ]] || continue
            echo "issue${output}=$issue" >> "$GITHUB_OUTPUT"
            output=$(( output + 1 ))
          done

  lane1:
    needs: prepare
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.issue1 != ''
    uses: ./.github/workflows/orchid-completion-lane.yml
    with:
      issue_number: ${{ needs.prepare.outputs.issue1 }}
    secrets: inherit

  lane2:
    needs: prepare
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.issue2 != ''
    uses: ./.github/workflows/orchid-completion-lane.yml
    with:
      issue_number: ${{ needs.prepare.outputs.issue2 }}
    secrets: inherit

  lane3:
    needs: prepare
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.issue3 != ''
    uses: ./.github/workflows/orchid-completion-lane.yml
    with:
      issue_number: ${{ needs.prepare.outputs.issue3 }}
    secrets: inherit

  lane4:
    needs: prepare
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.issue4 != ''
    uses: ./.github/workflows/orchid-completion-lane.yml
    with:
      issue_number: ${{ needs.prepare.outputs.issue4 }}
    secrets: inherit

  lane5:
    needs: prepare
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.issue5 != ''
    uses: ./.github/workflows/orchid-completion-lane.yml
    with:
      issue_number: ${{ needs.prepare.outputs.issue5 }}
    secrets: inherit

  publish-owner-gate:
    needs: [lane1, lane2, lane3, lane4, lane5]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      INTEGRATION_BRANCH: oc-autonomous-integration
    steps:
      - name: Keep one integration-to-main governance gate available
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Open or refresh the autonomous integration batch PR
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$INTEGRATION_BRANCH" || exit 0
          ahead=$(git rev-list --count "origin/main..origin/$INTEGRATION_BRANCH")
          (( ahead > 0 )) || exit 0

          existing=$(gh pr list --repo "$REPO" --state open --base main --head "$INTEGRATION_BRANCH" --json number --jq '.[0].number // empty')
          body=$(cat <<EOF
          Autonomously validated integration batch from $INTEGRATION_BRANCH.

          Routine green reversible engineering is pre-authorized to continue through the completion system. This PR remains a governance boundary only where protected scientific truth, sensitive locality, credentials/security, spending, destructive operations, or other constitutional policy is implicated.

          OC-AUTO-INTEGRATION-GATE
          EOF
          )

          if [[ -z "$existing" ]]; then
            if ! create_error=$(gh pr create --repo "$REPO" --base main --head "$INTEGRATION_BRANCH" --draft --title "OC autonomous integration batch" --body "$body" 2>&1 >/dev/null); then
              if grep -qi 'not permitted to create or approve pull requests' <<<"$create_error"; then
                notice="GitHub Actions is not permitted to create pull requests in $REPO. Enable Settings -> Actions -> General -> Workflow permissions -> Allow GitHub Actions to create and approve pull requests. The integration branch remains safe and active."
                echo "::warning title=Integration gate PR blocked by repository setting::$notice"
                printf '### Integration gate\n\n%s\n' "$notice" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "$create_error" >&2
              exit 1
            fi
            existing=$(gh pr list --repo "$REPO" --state open --base main --head "$INTEGRATION_BRANCH" --json number --jq '.[0].number // empty')
          else
            gh pr edit "$existing" --repo "$REPO" --body "$body" >/dev/null
          fi
          [[ -z "$existing" ]] || gh pr edit "$existing" --repo "$REPO" --add-label oc-owner-gate >/dev/null 2>&1 || true
