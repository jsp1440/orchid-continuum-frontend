name: Orchid Continuous Completion

# Canonical scheduler. Compatibility entrypoints delegate here; Portfolio
# Steward remains a separate queue-planning role, outside implementation capacity.
on:
  schedule:
    # Keep the five-minute cadence off the top-of-hour Actions load spike.
    - cron: '2/5 * * * *'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  issues:
    types: [closed, reopened, labeled, unlabeled]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

env:
  MAX_ACTIVE_LANES: 8
  PROVIDER_AUTHORIZED: 'true'

jobs:
  reconcile:
    name: Reconcile expired leases against hosted run evidence
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: read
    concurrency:
      group: orchid-lease-reconciliation-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - env:
          GH_TOKEN: ${{ github.token }}
        run: npx --no-install tsx scripts/oc-dispatch-runtime.ts reconcile

  supervisor:
    name: Discover governed work and refill the bounded reservoir
    needs: reconcile
    if: always() && github.event_name != 'pull_request' &&
      (needs.reconcile.result == 'success' || needs.reconcile.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    concurrency:
      group: orchid-supervisor-discovery-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - name: Scan Brain, backend, frontend, graph, and governed issue state
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_AUTHORIZED: 'false'
          # Admit the Calyx evidence-gap reserve plan (GET
          # /api/runner/knowledge-gaps/reserve-plan): at most 3 bounded,
          # review-required research missions per pass, no publication, no KG or
          # taxonomy mutation, locality-gated domains excluded. Fails closed and
          # files nothing when the backend plan is unavailable.
          OC_ADMIT_BACKEND_RESERVE: '1'
        run: npx --no-install tsx scripts/oc-supervisor-discovery.ts
      - name: Preserve the durable supervisor discovery packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oc-supervisor-${{ github.run_attempt }}
          path: .oc-wave/supervisor-discovery.json
          if-no-files-found: error

  plan:
    needs: [reconcile, supervisor]
    if: always() &&
      (needs.reconcile.result == 'success' || needs.reconcile.result == 'skipped') &&
      (needs.supervisor.result == 'success' || needs.supervisor.result == 'skipped')
    name: Graph admission and shared wave
    runs-on: ubuntu-latest
    concurrency:
      group: orchid-dispatch-plan-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      issues: ${{ steps.plan.outputs.issues }}
      wave_hash: ${{ steps.plan.outputs.wave_hash }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - name: Read complete inventory and rank canonical graph leaves
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          # The provider policy each lane's budget-preflight applies, mirrored
          # (never widened) so the plan admits provider-lane issues only up to
          # the slots that policy and the durable ledger can actually grant.
          # Pinned equal to orchid-budgeted-completion-lane.yml by test.
          OC_PROVIDER_NO_API_MODE: 'false'
          OC_PROVIDER_DISABLED: ''
          OC_PROVIDER_DAILY_MAX_CALLS: '4'
          OC_PROVIDER_WAVE_MAX_CALLS: '1'
        run: npx --no-install tsx scripts/oc-dispatch-runtime.ts plan
      - name: Preserve hash-addressed shared context
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oc-wave-${{ github.run_attempt }}
          path: .oc-wave/*.json
          include-hidden-files: true
          if-no-files-found: error

  # A pull_request run is plan-only: it proves the admission plan on the PR's
  # head, but never reserves leases, relabels issues or runs lanes against the
  # live queue and ledger. On 2026-09-25 the PR #821 run executed issue #816
  # from unmerged code. Scheduled, issue-event and manual runs dispatch.
  dispatch:
    needs: plan
    if: always() && github.event_name != 'pull_request' &&
      needs.plan.result == 'success' && needs.plan.outputs.issues != '[]'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      id-token: write
    uses: ./.github/workflows/orchid-deterministic-dispatch.yml
    secrets: inherit
    with:
      issues_json: ${{ needs.plan.outputs.issues }}
      wave_hash: ${{ needs.plan.outputs.wave_hash }}
      artifact_name: oc-wave-${{ github.run_attempt }}

  audit:
    name: Reconcile admitted plan with lane receipts
    needs: [plan, dispatch]
    if: always() && github.event_name != 'pull_request' &&
      needs.plan.result == 'success' && needs.plan.outputs.issues != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: oc-wave-${{ github.run_attempt }}
          path: .oc-wave
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: oc-lane-${{ github.run_attempt }}-*
          path: .oc-receipts
          merge-multiple: true
      - env:
          OC_WAVE_HASH: ${{ needs.plan.outputs.wave_hash }}
        run: npx --no-install tsx scripts/oc-dispatch-runtime.ts audit
