name: OCU University Production Verification

on:
  pull_request:
    paths:
      - 'index.html'
      - 'vite.config.ts'
      - 'scripts/verify-university-production.mjs'
      - '.github/workflows/ocu-university-production-verification.yml'
      - 'package.json'
  workflow_dispatch:
    inputs:
      frontend_url:
        description: 'Canonical frontend origin, for example https://orchidcontinuum.org'
        required: true
        type: string
      api_url:
        description: 'Calyx API base including /api, for example https://calyx.example.org/api'
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    name: Validate production verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Check verifier syntax
        run: node --check scripts/verify-university-production.mjs
      - name: Build frontend with release identity
        run: npm run build
      - name: Verify built app shell contains full Git SHA
        run: grep -Eq 'name="ocu-release-sha" content="[0-9a-f]{40}"' dist/index.html

  verify-production:
    name: Verify deployed University
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run production verification
        run: >-
          node scripts/verify-university-production.mjs
          '${{ inputs.frontend_url }}'
          '${{ inputs.api_url }}'
          university-production-evidence.json
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: university-production-evidence-${{ github.run_id }}
          path: university-production-evidence.json
          if-no-files-found: error
          retention-days: 90
