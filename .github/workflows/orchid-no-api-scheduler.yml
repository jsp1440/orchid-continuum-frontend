name: Orchid NO-API Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: orchid-no-api-scheduler-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  deterministic-scheduling:
    runs-on: ubuntu-latest
    env:
      OC_PROVIDER_NO_API_MODE: 'true'
      OC_DISABLED_PROVIDERS: anthropic,gemini,openai
      OC_PROVIDER_MIN_DISPATCH_INTERVAL_SECONDS: '3600'
      OC_PROVIDER_DAILY_CALL_BUDGET: '0'
      OC_PROVIDER_WAVE_CALL_BUDGET: '0'
    steps:
      - name: Checkout governed integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: oc-autonomous-integration
          fetch-depth: 1

      - name: Compute deterministic refill requirement
        id: refill
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          queued=$(gh issue list --repo "$REPO" --state open --label oc-queued --limit 500 --json number --jq 'length')
          running=$(gh issue list --repo "$REPO" --state open --label oc-running --limit 200 --json number --jq 'length')
          validating=$(gh issue list --repo "$REPO" --state open --label oc-validating --limit 200 --json number --jq 'length')
          node scripts/deterministicPortfolioRefill.mjs \
            --queued "$queued" \
            --running "$running" \
            --validating "$validating" \
            --target 10 \
            --max-refill-per-tick 5 \
            --github-output "$GITHUB_OUTPUT"

      - name: Evaluate provider governor without paid execution
        id: governor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/providerGovernorWorkflow.mjs \
            --no-api-mode true \
            --disabled-providers "$OC_DISABLED_PROVIDERS" \
            --min-dispatch-interval-seconds "$OC_PROVIDER_MIN_DISPATCH_INTERVAL_SECONDS" \
            --daily-call-budget "$OC_PROVIDER_DAILY_CALL_BUDGET" \
            --wave-call-budget "$OC_PROVIDER_WAVE_CALL_BUDGET" \
            --github-output "$GITHUB_OUTPUT"

      - name: Emit deterministic telemetry
        shell: bash
        run: |
          {
            echo '### Orchid NO-API scheduler'
            echo '- mode: deterministic-no-api'
            echo '- anthropic: parked'
            echo '- gemini: parked'
            echo '- openai: parked'
            echo '- paidProviderCallsAllowed: 0'
            echo "- refill_count: ${{ steps.refill.outputs.refill_count }}"
            echo "- governor_allow_paid_execution: ${{ steps.governor.outputs.allow_paid_execution }}"
            echo "- governor_reason: ${{ steps.governor.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert paid execution remains unreachable
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.governor.outputs.allow_paid_execution }}" != "true"
