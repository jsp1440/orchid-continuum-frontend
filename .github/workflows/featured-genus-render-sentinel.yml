name: Featured Genus Render Sentinel

on:
  workflow_dispatch:
  schedule:
    - cron: '23 14 * * *'

permissions:
  contents: read
  issues: write

jobs:
  audit-deployed-featured-genus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRONTEND_URL: https://orchid-continuum-frontend-vof6.onrender.com/
      CALYX_URL: https://orchid-calyx-backend.onrender.com
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      # The runtime the script imports ('playwright') and the CLI that downloads
      # the browser must be the same version. An ad hoc `npm install --no-save
      # playwright@1.55.0` next to the lockfile's @playwright/test left the CLI
      # at a newer release than the runtime, so the CLI fetched one browser build
      # and the runtime looked for another (run 36013583507:
      # "Executable doesn't exist at .../chromium_headless_shell-1187"). Install
      # from the lockfile and drive the CLI from that same install.
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - name: Run deployed browser audit
        run: node scripts/featured-genus-render-sentinel.mjs
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: featured-genus-render-sentinel
          path: artifacts/
          if-no-files-found: warn
      - name: Create or update one active incident
        if: failure()
        run: |
          title="Sentinel: Featured Genus deployment audit failing"
          body="The deployed Featured Genus audit failed. See workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID and artifact featured-genus-render-sentinel."
          issue_number=$(gh issue list --state open --search "in:title $title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
