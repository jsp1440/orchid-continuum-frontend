name: Orchid Claude Runtime Recovery — PARKED

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  issues: read

jobs:
  parked:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Anthropic provider circuit breaker
        shell: bash
        run: |
          set -euo pipefail
          echo "Anthropic runtime recovery is PARKED."
          echo "Provider canaries are disabled while the Anthropic organization is suspended."
          echo "This workflow makes zero Anthropic API calls and does not attempt recovery."
          {
            echo "### Anthropic recovery circuit breaker"
            echo
            echo "- Canary API calls: **0**"
            echo "- Automatic recovery attempts: **DISABLED**"
            echo "- Re-enable condition: explicit positive provider recovery evidence plus validated cost governor"
          } >> "$GITHUB_STEP_SUMMARY"
