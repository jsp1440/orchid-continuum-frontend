name: OC-PLATFORM-CLIENT-002 Validation

on:
  pull_request:
    paths:
      - "src/lib/parallelPlatform.ts"
      - ".github/workflows/oc-platform-client-002-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck --if-present
      - run: npm run lint --if-present
      - run: npm run build
