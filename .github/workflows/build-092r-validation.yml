name: BUILD-092R Frontend Validation

on:
  pull_request:
    paths:
      - "src/pages/MyConservatory.tsx"
      - "src/App.tsx"
      - "docs/BUILD-092R-*"
      - ".github/workflows/build-092r-validation.yml"
  push:
    branches: [main]

# Read-only: this workflow installs, lints, tests and builds. It writes
# nothing back to the repository and needs no token beyond fetching the tree.
permissions:
  contents: read

jobs:
  my-conservatory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Prohibited path scan
        run: |
          if grep -R -n -E 'C:/Users/|\.codex/visualizations|node_modules/' src/pages/MyConservatory.tsx docs/BUILD-092R-MY-CONSERVATORY-FRONTEND-RELOCATION.md; then
            exit 1
          fi
