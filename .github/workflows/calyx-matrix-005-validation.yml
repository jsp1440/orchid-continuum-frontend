name: CALYX-MATRIX-005 Validation

on:
  pull_request:
    branches: [main, oc-autonomous-integration]
  push:
    branches: [oc-autonomous-integration]
  workflow_dispatch:

# Read-only: this workflow installs, lints, tests and builds. It writes
# nothing back to the repository and needs no token beyond fetching the tree.
permissions:
  contents: read

jobs:
  guided-identification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Focused Matrix regressions
        run: npm test -- src/lib/matrixIdentification.test.ts
      - name: Production build
        run: npm run build
      - name: Lint Matrix implementation
        run: npx eslint src/pages/OrchidIdentificationNext.tsx src/lib/matrixIdentification.ts src/lib/matrixIdentification.test.ts
