# Render Blueprint for the canonical Orchid Continuum frontend.
#
# This service is an existing Render Static Site. The declaration is kept
# intentionally small: it pins the existing repository/branch/build output
# and makes the SPA route contract part of the service configuration instead
# of relying only on an out-of-band dashboard rule.
services:
  - type: web
    name: orchid-continuum-frontend
    runtime: static
    repo: https://github.com/jsp1440/orchid-continuum-frontend.git
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /research-station/researchers/jeffery-scott-parham
        destination: /researcher-jeffery-scott-parham.html
      - type: rewrite
        source: /admin
        destination: /index.html
      - type: rewrite
        source: /control-center
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
